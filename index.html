<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ÉcoleBank — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --navy-950:#040B18;
  --navy-900:#081831;
  --navy-800:#0C2350;
  --navy-700:#153274;
  --navy-600:#2748A0;
  --navy-500:#3E5FC4;
  --navy-100:#E8EDF8;
  --navy-50:#F3F6FC;
  --white:#FFFFFF;
  --surface:#FFFFFF;
  --ink:#0A1B3D;
  --muted:#647096;
  --muted-2:#8792B0;
  --line:#E2E8F5;
  --pos:#1B8F5A;
  --pos-bg:#E7F6EE;
  --neg:#C4433F;
  --neg-bg:#FBEAEA;
  --r-lg:24px;
  --r-md:16px;
  --r-sm:11px;
  --shadow-card:0 18px 34px -16px rgba(8,24,63,.35);
  --shadow-soft:0 8px 20px -10px rgba(8,24,63,.18);
}
.dark{
  --navy-50:#0A1631;
  --surface:#101F42;
  --white:#0F1D3D;
  --ink:#EDF1FF;
  --muted:#96A3CC;
  --muted-2:#7684AC;
  --line:#213259;
  --navy-100:#152548;
  --pos-bg:#123326;
  --neg-bg:#37191A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--navy-950);
  color:var(--ink);
  min-height:100vh;
}
#root{display:flex;justify-content:center;width:100%;min-height:100vh;}
h1,h2,h3,.display{font-family:'Manrope',sans-serif;}
button{font-family:inherit;cursor:pointer;}
.tnum{font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:0;height:0;}

.phone{
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:var(--navy-50);
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 80px rgba(0,0,0,.5);
}

/* ---------- LOGIN ---------- */
.login-wrap{
  width:100%;max-width:430px;min-height:100vh;
  background:radial-gradient(120% 100% at 50% 0%, var(--navy-700) 0%, var(--navy-900) 55%, var(--navy-950) 100%);
  color:#fff;padding:56px 26px 40px;display:flex;flex-direction:column;
}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.login-brand .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#fff,#B9C8F2);display:flex;align-items:center;justify-content:center;color:var(--navy-900);font-weight:800;font-family:'Manrope';font-size:16px;}
.login-brand span{font-family:'Manrope';font-weight:800;font-size:19px;letter-spacing:.2px;}
.login-tag{color:#A9B8E4;font-size:14px;margin:0 0 40px;}
.login-hero{font-family:'Manrope';font-weight:800;font-size:28px;line-height:1.25;margin:0 0 6px;}
.login-sub{color:#A9B8E4;font-size:14.5px;margin:0 0 34px;}
.login-list{display:flex;flex-direction:column;gap:10px;}
.login-item{
  display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);
  border-radius:16px;padding:13px 15px;text-align:left;color:#fff;
  transition:.15s;
}
.login-item:active{transform:scale(.98);background:rgba(255,255,255,.12);}
.login-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;color:#fff;}
.login-item .li-name{font-weight:700;font-size:14.5px;}
.login-item .li-role{color:#A9B8E4;font-size:12.5px;margin-top:1px;}
.login-item .chev{margin-left:auto;opacity:.6;}
.login-foot{margin-top:auto;padding-top:30px;color:#7C8BC0;font-size:11.5px;text-align:center;line-height:1.6;}

/* ---------- SHELL ---------- */
.header{
  position:sticky;top:0;z-index:20;background:var(--navy-50);
  display:flex;align-items:center;gap:12px;padding:16px 18px 12px;
}
.dark .header{background:var(--navy-50);}
.avatar{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;
  font-family:'Manrope';
}
.header-mid{flex:1;min-width:0;}
.header-greet{font-size:13px;color:var(--muted);margin:0;}
.header-name{font-family:'Manrope';font-weight:800;font-size:16.5px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;flex-shrink:0;
}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--neg);border:1.5px solid var(--surface);}

.screen{flex:1;overflow-y:auto;padding:4px 18px 110px;}

.bottomnav{
  position:sticky;bottom:0;z-index:20;background:var(--surface);
  border-top:1px solid var(--line);order:1;
  display:flex;padding:9px 6px calc(9px + env(safe-area-inset-bottom));
}
.nav-btn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted-2);padding:5px 2px;border-radius:12px;}
.nav-btn.active{color:var(--navy-700);}
.dark .nav-btn.active{color:#8FA6F5;}
.nav-btn span{font-size:10.5px;font-weight:600;}

/* ---------- CARDS / SECTIONS ---------- */
.section-title{font-family:'Manrope';font-weight:800;font-size:15px;margin:22px 0 12px;display:flex;align-items:center;justify-content:space-between;}
.section-title .link{font-family:'Inter';font-weight:600;font-size:12.5px;color:var(--navy-600);}
.dark .section-title .link{color:#8FA6F5;}

.balance-card{
  background:linear-gradient(135deg,var(--navy-900) 0%, var(--navy-700) 100%);
  border-radius:var(--r-lg);padding:22px 22px 20px;color:#fff;position:relative;overflow:hidden;
  box-shadow:var(--shadow-card);margin-top:10px;
}
.balance-card::before{content:'';position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%);top:-90px;right:-60px;}
.balance-card::after{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07),transparent 70%);bottom:-70px;left:-40px;}
.bc-row{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.bc-label{font-size:12.5px;color:#B9C6EE;margin:0 0 6px;}
.bc-amount{font-family:'Manrope';font-weight:800;font-size:32px;letter-spacing:.3px;}
.bc-toggle{background:rgba(255,255,255,.14);border:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;}
.bc-acct{font-size:12px;color:#B9C6EE;margin-top:14px;letter-spacing:.5px;position:relative;z-index:1;}

.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px;}
.qa-btn{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink);}
.qa-btn .qi{width:38px;height:38px;border-radius:12px;background:var(--navy-100);display:flex;align-items:center;justify-content:center;color:var(--navy-700);}
.dark .qa-btn .qi{color:#8FA6F5;}
.qa-btn span{font-size:11px;font-weight:600;}

.list-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;}
.tx-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);}
.tx-row:last-child{border-bottom:none;}
.tx-icn{width:38px;height:38px;border-radius:11px;background:var(--navy-100);display:flex;align-items:center;justify-content:center;color:var(--navy-700);flex-shrink:0;}
.dark .tx-icn{color:#8FA6F5;}
.tx-mid{flex:1;min-width:0;}
.tx-desc{font-size:13.5px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-cat{font-size:11.5px;color:var(--muted);margin:2px 0 0;}
.tx-amt{font-weight:700;font-size:13.5px;}
.tx-amt.pos{color:var(--pos);}
.tx-amt.neg{color:var(--ink);}
.tx-date{font-size:10.5px;color:var(--muted-2);margin-top:2px;text-align:right;}

.mini-chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-top:14px;min-width:0;overflow:hidden;}
.mini-chart-card canvas,.chart-card canvas{max-width:100%;display:block;}
.mini-chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.mini-chart-head h4{margin:0;font-size:13px;font-family:'Manrope';font-weight:800;}
.mini-chart-head .val{font-size:12px;color:var(--pos);font-weight:700;}

.notif-banner{display:flex;gap:11px;background:var(--navy-100);border-radius:var(--r-md);padding:13px 14px;margin-top:14px;align-items:flex-start;}
.dark .notif-banner{background:var(--navy-100);}
.notif-banner .ic{color:var(--navy-700);flex-shrink:0;margin-top:1px;}
.dark .notif-banner .ic{color:#8FA6F5;}
.notif-banner p{margin:0;font-size:12.5px;line-height:1.5;}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-top:8px;}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:30px;padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;}
.chip.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}
.chip .cdot{width:7px;height:7px;border-radius:50%;}

/* CARD (bank card visual) */
.bank-card{
  background:linear-gradient(135deg,var(--navy-950) 0%, var(--navy-800) 55%, var(--navy-600) 130%);
  border-radius:20px;padding:20px 78px 20px 20px;color:#fff;position:relative;overflow:hidden;
  aspect-ratio:1.586;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:var(--shadow-card);
}
.bank-card.frozen{filter:grayscale(.85) brightness(.8);}
.bank-card::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 70%);top:-80px;right:-50px;}
.bc-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
.bc-top .bank-name{font-family:'Manrope';font-weight:800;font-size:18px;letter-spacing:.3px;}
.bc-top .ctype{font-size:11px;color:#8FB3F0;margin-top:3px;}
.chip-icon{width:34px;height:24px;border-radius:5px;background:linear-gradient(135deg,#E8C468,#C79B3B);}
.bc-number{font-family:'Manrope';font-weight:700;font-size:16.5px;letter-spacing:2.5px;position:relative;z-index:1;}
.bc-bottom{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1;}
.bc-holder{font-size:16px;font-weight:600;letter-spacing:.2px;}
.bc-exp{font-size:10.5px;color:#B9C6EE;margin-top:3px;}
.bc-divider{position:absolute;top:16px;bottom:16px;right:52px;width:2px;background:rgba(255,255,255,.9);z-index:1;}
.bc-network-vert{position:absolute;top:0;bottom:0;right:10px;width:36px;display:flex;align-items:center;justify-content:center;z-index:1;}
.bc-network-vert span{writing-mode:vertical-rl;font-family:'Manrope';font-weight:800;font-size:15px;letter-spacing:3px;color:#fff;}
.frozen-badge{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.5);font-size:9.5px;padding:4px 9px;border-radius:20px;font-weight:700;letter-spacing:.5px;z-index:2;}

.card-add-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--navy-800);color:#fff;border:none;border-radius:var(--r-md);padding:15px;font-weight:700;font-size:13.5px;width:100%;margin-top:16px;}
.card-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.meta-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;}
.meta-box .ml{font-size:11px;color:var(--muted);margin:0 0 4px;}
.meta-box .mv{font-size:14px;font-weight:700;margin:0;}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.act-btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink);}
.act-btn.danger{color:var(--neg);}
.act-btn.primary{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}

.limit-row{margin-top:14px;}
.limit-row .lr-head{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;}
.limit-row .lr-head b{font-weight:700;}
input[type=range]{width:100%;accent-color:var(--navy-700);}

/* PAYMENTS GRID */
.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
.pay-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.pay-tile .pi{width:42px;height:42px;border-radius:13px;background:var(--navy-100);display:flex;align-items:center;justify-content:center;color:var(--navy-700);}
.dark .pay-tile .pi{color:#8FA6F5;}
.pay-tile span{font-size:11px;font-weight:700;line-height:1.3;}
.pay-tile small{font-size:9.5px;color:var(--muted);}

.scan-card{background:linear-gradient(135deg,var(--navy-800),var(--navy-600));border-radius:var(--r-md);padding:16px;color:#fff;display:flex;align-items:center;gap:13px;margin-top:14px;}
.scan-card .si{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.scan-card b{font-size:13.5px;display:block;}
.scan-card small{color:#B9C6EE;font-size:11.5px;}
.scan-card .go{margin-left:auto;background:#fff;color:var(--navy-800);border:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* TRANSFERS */
.tab-switch{display:flex;background:var(--navy-100);border-radius:14px;padding:4px;margin-top:6px;}
.tab-switch button{flex:1;border:none;background:none;padding:10px;border-radius:11px;font-weight:700;font-size:12.5px;color:var(--muted);}
.tab-switch button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-soft);}
.benef-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);}
.benef-row:last-child{border-bottom:none;}
.benef-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12.5px;flex-shrink:0;}
.benef-mid{flex:1;}
.benef-mid b{font-size:13.5px;display:block;}
.benef-mid small{color:var(--muted);font-size:11.5px;}
.add-benef{display:flex;align-items:center;gap:12px;padding:13px 4px;color:var(--navy-700);font-weight:700;font-size:13px;}
.dark .add-benef{color:#8FA6F5;}
.add-benef .aic{width:40px;height:40px;border-radius:50%;border:1.5px dashed var(--navy-600);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* FINANCES */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;}
.stat-box .sl{font-size:11.5px;color:var(--muted);margin:0 0 6px;display:flex;align-items:center;gap:6px;}
.stat-box .sv{font-family:'Manrope';font-weight:800;font-size:19px;margin:0;}
.stat-box .sv.pos{color:var(--pos);}
.stat-box .sv.neg{color:var(--neg);}
.period-row{display:flex;gap:7px;margin-top:16px;}
.period-btn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px;font-size:12px;font-weight:700;color:var(--muted);}
.period-btn.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-top:14px;min-width:0;overflow:hidden;}
.cat-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.cat-row:last-child{border-bottom:none;}
.cat-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.cat-row b{font-size:12.5px;flex:1;font-weight:600;}
.cat-row span{font-size:12.5px;font-weight:700;}

/* PROFILE */
.profile-head{display:flex;flex-direction:column;align-items:center;padding:14px 0 6px;}
.profile-head .pav{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24px;font-family:'Manrope';margin-bottom:12px;}
.profile-head h3{margin:0;font-size:17px;}
.profile-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted);}
.settings-group{margin-top:20px;}
.settings-label{font-size:11.5px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px 4px;}
.settings-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);padding:13px 14px;}
.settings-item:first-of-type{border-radius:14px 14px 0 0;}
.settings-item:last-of-type{border-radius:0 0 14px 14px;border-top:none;}
.settings-item:only-of-type{border-radius:14px;}
.settings-item + .settings-item{border-top:none;}
.settings-item .sic{width:34px;height:34px;border-radius:10px;background:var(--navy-100);display:flex;align-items:center;justify-content:center;color:var(--navy-700);flex-shrink:0;}
.dark .settings-item .sic{color:#8FA6F5;}
.settings-item .stx{flex:1;font-size:13.5px;font-weight:600;}
.settings-item small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:1px;}
.toggle{width:42px;height:24px;border-radius:20px;background:var(--line);position:relative;border:none;flex-shrink:0;transition:.2s;}
.toggle.on{background:var(--navy-700);}
.toggle::after{content:'';position:absolute;width:19px;height:19px;background:#fff;border-radius:50%;top:2.5px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.toggle.on::after{left:20px;}
.logout-btn{width:100%;margin-top:22px;background:var(--neg-bg);color:var(--neg);border:none;border-radius:14px;padding:14px;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;}

/* ADMIN */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.kpi-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;}
.kpi-box .kl{font-size:11px;color:var(--muted);margin:0 0 5px;}
.kpi-box .kv{font-family:'Manrope';font-weight:800;font-size:20px;margin:0;}
.kpi-box .kd{font-size:10.5px;margin-top:4px;font-weight:700;}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-top:10px;}
.trow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);}
.trow:last-child{border-bottom:none;}
.trow .tleft{flex:1;min-width:0;}
.trow .tleft b{font-size:12.5px;display:block;}
.trow .tleft small{font-size:11px;color:var(--muted);}
.badge{font-size:10px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;}
.badge.ok{background:var(--pos-bg);color:var(--pos);}
.badge.pending{background:#FDF3DC;color:#A9761B;}
.badge.fail{background:var(--neg-bg);color:var(--neg);}
.filter-row{display:flex;gap:7px;overflow-x:auto;margin-top:12px;}
.search-box{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-top:10px;color:var(--muted);}
.search-box input{border:none;background:none;outline:none;flex:1;font-size:13px;color:var(--ink);font-family:inherit;}

/* MODAL — always centered, on every screen size, no media-query dependency */
.modal-root{position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none;}
.modal-root.open{pointer-events:auto;}
.modal-backdrop{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(4,11,24,.55);opacity:0;transition:opacity .2s;}
.modal-root.open .modal-backdrop{opacity:1;}
.modal-sheet{
  position:relative;width:100%;max-width:430px;background:var(--navy-50);border-radius:22px;
  padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto;
  transform:scale(.94);opacity:0;transition:transform .2s ease, opacity .2s ease;
}
.modal-root.open .modal-sheet{transform:scale(1);opacity:1;}
.sheet-handle{display:none;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sheet-head h3{margin:0;font-size:16.5px;}
.sheet-close{width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px;}
.field input,.field select{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;
  font-size:14px;font-family:inherit;color:var(--ink);outline:none;
}
.field input:focus,.field select:focus{border-color:var(--navy-600);}
.amount-input{font-family:'Manrope';font-weight:800;font-size:34px;text-align:center;border:none;background:none;width:100%;outline:none;color:var(--ink);}
.seg{display:flex;gap:8px;flex-wrap:wrap;}
.seg-opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:12.5px;font-weight:700;color:var(--ink);flex:1;min-width:100px;text-align:center;}
.seg-opt.active{border-color:var(--navy-700);background:var(--navy-100);color:var(--navy-800);}
.dark .seg-opt.active{color:#8FA6F5;}
.btn-primary{width:100%;background:var(--navy-800);color:#fff;border:none;border-radius:14px;padding:15px;font-weight:700;font-size:14px;margin-top:6px;}
.btn-primary:disabled{opacity:.45;}
.btn-secondary{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:15px;font-weight:700;font-size:14px;margin-top:10px;}
.summary-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.summary-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;}
.summary-row b{font-weight:700;}
.summary-row + .summary-row{border-top:1px solid var(--line);}

.result-wrap{text-align:center;padding:14px 6px 4px;}
.result-check{width:70px;height:70px;border-radius:50%;background:var(--pos-bg);color:var(--pos);display:flex;align-items:center;justify-content:center;margin:6px auto 18px;}
.result-wrap h2{font-size:20px;margin:0 0 6px;}
.result-wrap p{color:var(--muted);font-size:13px;margin:0 0 20px;}
.result-amount{font-family:'Manrope';font-weight:800;font-size:30px;margin-bottom:22px;}

.pin-dots{display:flex;justify-content:center;gap:14px;margin:26px 0 18px;}
.pin-dots .pd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted-2);}
.pin-dots .pd.filled{background:var(--navy-700);border-color:var(--navy-700);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.key{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:19px;font-weight:700;text-align:center;}
.key.ghost{background:none;border:none;}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--navy-900);color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state .es-ic{width:60px;height:60px;border-radius:50%;background:var(--navy-100);color:var(--navy-700);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.dark .empty-state .es-ic{color:#8FA6F5;}
.empty-state h4{margin:0 0 6px;color:var(--ink);}
.empty-state p{margin:0;font-size:12.5px;}

.hidden{display:none !important;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:42px;}
.pw-eye{position:absolute;right:8px;top:32px;background:none;border:none;color:var(--muted);padding:6px;display:flex;}
.login-wrap .pw-eye{color:#B9C6EE;}

/* CURRENCY ICON (replaces $ in display text) */
.cur{height:1.05em;width:auto;vertical-align:-0.15em;display:inline-block;filter:brightness(0) saturate(100%);margin-right:2px;}
.cur.on-dark{filter:none;}
.cur-badge{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--navy-800);flex-shrink:0;}
.cur-badge img{height:0.85em;filter:none;}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:999;background:radial-gradient(120% 100% at 50% 0%,var(--navy-700) 0%,var(--navy-900) 55%,var(--navy-950) 100%);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity .5s ease;}
#splash img{width:min(60vw,240px);border-radius:26px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);}
#splash .sp-name{color:#fff;font-family:'Manrope';font-weight:800;font-size:15px;margin-top:18px;letter-spacing:.5px;}
#splash.fade{opacity:0;pointer-events:none;}

/* CARD — realistic normal size */
.bank-card{max-width:360px;margin:0 auto;aspect-ratio:1.586;}
.card-wrap{max-width:360px;margin:0 auto;}

/* LOADING */
.loading-wrap{text-align:center;padding:40px 10px;}
.spinner{width:52px;height:52px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--navy-700);margin:0 auto 20px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-wrap p{color:var(--muted);font-size:13px;margin:0;}

/* CODE / NUMBER REVEAL */
.code-box{background:var(--surface);border:1.5px dashed var(--navy-600);border-radius:16px;padding:20px;text-align:center;margin:18px 0;}
.code-box .cl{font-size:11.5px;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
.code-box .cv{font-family:'Manrope';font-weight:800;font-size:26px;letter-spacing:6px;margin:0;}

/* NOTIF GROUP HEADER */
.notif-group{font-size:11.5px;font-weight:800;color:var(--muted-2);text-transform:uppercase;letter-spacing:.6px;margin:16px 4px 8px;}
.notif-group:first-child{margin-top:4px;}

.role-hint{background:var(--navy-100);border-radius:14px;padding:16px;font-size:12.5px;line-height:1.6;color:var(--ink);margin-top:6px;}

/* ---------- RESPONSIVE: TABLET / DESKTOP / ANY DEVICE ---------- */
.content-col{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0;overflow:hidden;}
.nav-brand{display:none;}

@media (min-width:760px){
  body{background:var(--navy-50);align-items:stretch;}
  .phone{max-width:100%;width:100%;min-height:100vh;flex-direction:row;box-shadow:none;background:var(--navy-50);}
  .bottomnav{
    order:-1;position:sticky;top:0;flex-direction:column;justify-content:flex-start;align-items:stretch;
    width:92px;height:100vh;border-top:none;border-right:1px solid var(--line);padding:18px 8px;gap:5px;
    flex-shrink:0;
  }
  .nav-brand{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 4px 20px;}
  .nav-brand .nb-mark{width:32px;height:32px;border-radius:9px;background:var(--navy-800);color:#fff;font-family:'Manrope';font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .nav-brand .nb-text{display:none;font-family:'Manrope';font-weight:800;font-size:14.5px;}
  .nav-btn{border-radius:13px;padding:12px 4px;}
  .nav-btn.active{background:var(--navy-100);}
  .header{padding:22px 34px 12px;max-width:1040px;margin:0 auto;width:100%;}
  .screen{padding:8px 34px 60px;max-width:1040px;margin:0 auto;width:100%;}
  .modal-root{align-items:center;}
  .login-wrap{max-width:100%;width:100%;padding:64px 0 48px;align-items:center;}
  .login-brand,.login-tag,.login-hero,.login-sub,.login-list,.login-foot{width:100%;max-width:430px;}
}

@media (min-width:1080px){
  .bottomnav{width:250px;align-items:stretch;padding:22px 16px;}
  .nav-brand{justify-content:flex-start;padding:6px 10px 24px;}
  .nav-brand .nb-text{display:block;}
  .nav-btn{flex-direction:row;justify-content:flex-start;gap:13px;padding:13px 15px;}
  .nav-btn span{font-size:13px;}
  .header,.screen{max-width:1120px;}
  .quick-actions{max-width:560px;}
  .pay-grid{grid-template-columns:repeat(4,1fr);}
  .kpi-grid,.stat-grid{grid-template-columns:repeat(4,1fr);}
  .bc-amount{font-size:36px;}
}

@media (min-width:1400px){
  .header,.screen{max-width:1240px;}
}
</style>

function genNumber(){ let n; do{ n=String(Math.floor(100000+Math.random()*899999)); }while(ACCOUNTS[n]); return n; }
function genId(prefix){ return prefix+'-'+String(Math.floor(100000+Math.random()*899999)); }
function fmtNum(n){ const neg=n<0; return (neg?'-':'')+Math.abs(n).toFixed(2); }
function fmt(n){ return '$'+fmtNum(n); } // plain text, for inputs/logic
function money(n,dark){ // HTML display with logo instead of $
  const neg = n<0;
  return `${neg?'-':''}${dark?CURD:CUR}${Math.abs(n).toFixed(2)}`;
}

function toast(msg){
  const t=document.getElementById('toast');
  t.innerHTML=icon('check',16)+`<span>${msg}</span>`;
  t.classList.add('show');
  clearTimeout(window._tt);
  window._tt=setTimeout(()=>t.classList.remove('show'),2400);
}

async function createAccount({nom,prenom,genre,password,role,classe}){
  const number = genNumber();
  const acc = {
    number, nom, prenom, genre:genre||'', password:password||'', role, classe:classe||'',
    name: prenom+' '+nom,
    balance: 0, status:'active', accountType:'courant',
    cards: [],
    transactions: [],
    notifications: [],
    createdAt: new Date(),
  };
  ACCOUNTS[number] = acc;
  await sb.from('accounts').insert({number,nom,prenom,genre:acc.genre,password:acc.password,role,classe:acc.classe,balance:0,status:'active',account_type:'courant'});
  return acc;
}

// Charge toutes les données depuis Supabase (comptes, cartes, transactions,
// notifications, demandes) dans le même format que l'ancien cache local.
async function loadFromSupabase(){
  const [accRes, cardRes, txRes, notifRes, rcRes, wdRes] = await Promise.all([
    sb.from('accounts').select('*'),
    sb.from('cards').select('*'),
    sb.from('transactions').select('*').order('created_at',{ascending:false}),
    sb.from('notifications').select('*').order('created_at',{ascending:false}),
    sb.from('recharge_requests').select('*').order('created_at',{ascending:false}),
    sb.from('withdraw_requests').select('*').order('created_at',{ascending:false}),
  ]);
  for(const k in ACCOUNTS) delete ACCOUNTS[k];
  (accRes.data||[]).forEach(a=>{
    ACCOUNTS[a.number] = {
      number:a.number, nom:a.nom, prenom:a.prenom, genre:a.genre, password:a.password, role:a.role, classe:a.classe,
      name:a.prenom+' '+a.nom, balance:Number(a.balance), status:a.status, accountType:a.account_type,
      cards:[], transactions:[], notifications:[], createdAt:new Date(a.created_at),
    };
  });
  (cardRes.data||[]).forEach(c=>{
    const acc = ACCOUNTS[c.account_number]; if(!acc) return;
    acc.cards.push({id:c.id, holder:c.holder, last4:c.last4, full:c.full_number, cvv:c.cvv, exp:c.exp, frozen:c.frozen, cardBalance:Number(c.card_balance)});
  });
  (txRes.data||[]).forEach(t=>{
    const acc = ACCOUNTS[t.account_number]; if(!acc) return;
    const d = new Date(t.created_at);
    acc.transactions.push({id:t.id, desc:t.description, cat:t.category, amount:Number(t.amount), date:d, label:todayStr2(d)});
  });
  (notifRes.data||[]).forEach(n=>{
    const acc = ACCOUNTS[n.account_number]; if(!acc) return;
    acc.notifications.push({id:n.id, text:n.text, read:n.read, date:new Date(n.created_at)});
  });
  RECHARGE_REQUESTS.length=0;
  (rcRes.data||[]).forEach(r=>{
    const acc=ACCOUNTS[r.account_number];
    RECHARGE_REQUESTS.push({id:r.id, accountNumber:r.account_number, name:acc?acc.name:r.account_number, method:r.method, amount:Number(r.amount), ref:r.ref, status:r.status, date:new Date(r.created_at)});
  });
  WITHDRAW_REQUESTS.length=0;
  (wdRes.data||[]).forEach(r=>{
    const acc=ACCOUNTS[r.account_number];
    WITHDRAW_REQUESTS.push({id:r.id, accountNumber:r.account_number, name:acc?acc.name:r.account_number, amount:Number(r.amount), fee:Number(r.fee), total:Number(r.total), status:r.status, date:new Date(r.created_at)});
  });
}
function todayStr2(d){
  const days = Math.floor((Date.now()-d.getTime())/86400000);
  if(days<=0) return "Aujourd'hui";
  if(days===1) return 'Hier';
  return d.toLocaleDateString('fr-FR');
}

    .on('postgres_changes', {event:'*', schema:'public', table:'accounts'}, syncAll)
    .on('postgres_changes', {event:'*', schema:'public', table:'cards'}, syncAll)
    .on('postgres_changes', {event:'*', schema:'public', table:'transactions'}, syncAll)
    .on('postgres_changes', {event:'*', schema:'public', table:'notifications'}, syncAll)
    .on('postgres_changes', {event:'*', schema:'public', table:'recharge_requests'}, syncAll)
    .on('postgres_changes', {event:'*', schema:'public', table:'withdraw_requests'}, syncAll)
    .subscribe();
}

function submitRegistration(){
  const nom = document.getElementById('f-nom').value.trim();
  const prenom = document.getElementById('f-prenom').value.trim();
  if(!nom||!prenom){ toast('Veuillez remplir le nom et le prénom'); return; }
  auth.form.nom=nom; auth.form.prenom=prenom;
  if(auth.role==='eleve'){
    auth.form.classe = document.getElementById('f-classe').value;
  } else {
    auth.form.genre = document.getElementById('f-genre').value;
    auth.form.password = document.getElementById('f-pass').value;
    if(!auth.form.password){ toast('Veuillez créer un mot de passe'); return; }
  }
  auth.view='loading'; renderRoot();
  setTimeout(async ()=>{
    const acc = await createAccount({nom:auth.form.nom,prenom:auth.form.prenom,genre:auth.form.genre,password:auth.form.password,role:auth.role,classe:auth.form.classe});
    auth.createdNumber = acc.number;
    auth.showCode = false;
    auth.view='success'; renderRoot();
  }, 3000);
}

function doLogin(){
  const num = document.getElementById('l-num').value.trim();
  const pass = document.getElementById('l-pass').value;
  const acc = ACCOUNTS[num];
  if(!acc){ auth.loginErr='Numéro de compte introuvable.'; renderRoot(); return; }
  if(acc.status==='suspended'){ auth.loginErr='Ce compte est suspendu. Contactez l’administration.'; renderRoot(); return; }
  if(acc.password && acc.password!==pass){ auth.loginErr='Mot de passe incorrect.'; renderRoot(); return; }
  loginAs(num);
}
function loginAs(number){
  state.session = number;
  const u = ACCOUNTS[number];
  state.screen = (u.role==='direction') ? 'dashboard' : 'accueil';
  state.adminScreen = 'dashboard';
  auth.view='role'; auth.form={}; auth.loginNumber=''; auth.loginPass=''; auth.loginErr='';
  renderRoot();
}
function logout(){ state.session=null; auth.view='role'; renderRoot(); }

  if(isAdmin(user())){ state.adminScreen='profil'; } else { state.screen='profil'; }

  renderRoot();
}
function toggleNotif(){ state.notifOpen=!state.notifOpen; renderRoot(); }
function markAllRead(){ (user().notifications||[]).forEach(n=>n.read=true); renderRoot(); }

function notifBucket(n){
  const days = Math.floor((Date.now()-n.date.getTime())/86400000);
  if(days<=0) return "Aujourd'hui";
  if(days===1) return 'Hier';
  return n.date.toLocaleDateString('fr-FR');
}
function renderNotifPanel(){
  const list = (user().notifications||[]).slice().sort((a,b)=>b.date-a.date);
  const groups = {};
  list.forEach(n=>{ const k=notifBucket(n); (groups[k]=groups[k]||[]).push(n); });
  return `
  <div class="modal-root open" style="align-items:flex-start;" onclick="if(event.target===this){toggleNotif()}">
    <div class="modal-backdrop"></div>
    <div class="modal-sheet" style="margin-top:70px;border-radius:22px;max-height:74vh;">
      <div class="sheet-head" style="margin-top:6px;">
        <h3>Notifications</h3>
        <button class="sheet-close" onclick="toggleNotif()">${icon('x',16)}</button>
      </div>
      ${list.length===0?`<div class="empty-state"><div class="es-ic">${icon('bell',26)}</div><h4>Aucune notification</h4></div>`:
      `${Object.entries(groups).map(([g,items])=>`
        <div class="notif-group">${g}</div>
        <div class="list-card" style="margin-bottom:10px;">
          ${items.map(n=>`
            <div class="tx-row">
              <div class="tx-icn">${icon('alert',18)}</div>
              <div class="tx-mid"><p class="tx-desc" style="white-space:normal;">${n.text}</p></div>
              ${!n.read?`<div style="background:var(--navy-700);width:8px;height:8px;border-radius:50%;flex-shrink:0;"></div>`:''}
            </div>`).join('')}
        </div>`).join('')}
      <button class="btn-secondary" onclick="markAllRead()">Tout marquer comme lu</button>`}
    </div>
  </div>`;
}

function renderScreen(){
  const u = user();
  if(isAdmin(u)){
    switch(state.adminScreen){
      case 'dashboard': return renderAdminDashboard();
      case 'demandes': return renderAdminDemandes();
      case 'comptes': return renderAdminComptes();
      case 'transactions': return renderAdminTransactions();
      case 'profil': return renderProfil();
      default: return renderAdminDashboard();
    }
  }
  switch(state.screen){
    case 'accueil': return renderAccueil();
    case 'cartes': return renderCartes();
    case 'paiements': return renderPaiements();
    case 'transferts': return renderTransferts();
    case 'finances': return renderFinances();
    case 'profil': return renderProfil();
    case 'abonnement': return renderAbonnement();
    default: return renderAccueil();
  }
}

function findCard(id){ return user().cards.find(c=>c.id===id); }
function makeCardObj(holder){
  const exp = new Date(); exp.setFullYear(exp.getFullYear()+1);
  const expStr = String(exp.getMonth()+1).padStart(2,'0')+'/'+String(exp.getFullYear()).slice(-2);
  return {id:genId('CARD'), holder:holder, last4:String(Math.floor(1000+Math.random()*8999)), full:'45'+Math.floor(Math.random()*100000000000000), cvv:String(Math.floor(100+Math.random()*899)), exp:expStr, frozen:false, cardBalance:0};
}
function autoCreateCard(){
  const u = user();
  openModal(`<div class="loading-wrap"><div class="spinner"></div><p>Création de votre carte…</p></div>`);
  setTimeout(async ()=>{
    const c = makeCardObj(u.name);
    u.cards.push(c);
    await sb.from('cards').insert({id:c.id, account_number:u.number, holder:c.holder, last4:c.last4, full_number:c.full, cvv:c.cvv, exp:c.exp, frozen:false, card_balance:0});
    closeModal(); renderRoot(); toast('Carte créée avec succès');
  },1200);
}

  if(u.balance<100){ toast('Solde du compte insuffisant'); return; }
  u.balance -= 100;
  const c = makeCardObj(u.name);
  u.cards.push(c);
  const tx = {id:genId('HB'),label:todayStr(),desc:'Création — 2e carte',cat:'Carte',amount:-100,date:new Date()};
  u.transactions.unshift(tx);
  await Promise.all([
    sb.from('accounts').update({balance:u.balance}).eq('number',u.number),
    sb.from('cards').insert({id:c.id, account_number:u.number, holder:c.holder, last4:c.last4, full_number:c.full, cvv:c.cvv, exp:c.exp, frozen:false, card_balance:0}),
    sb.from('transactions').insert({id:tx.id, account_number:u.number, description:tx.desc, category:tx.cat, amount:tx.amount}),
  ]);
  closeModal(); renderRoot(); toast('Nouvelle carte créée');
}
async function deleteCard(id){
  const u = user();

  u.cards = u.cards.filter(c=>c.id!==id);
  await sb.from('cards').delete().eq('id',id);
  renderRoot(); toast('Carte supprimée');
}

let pinState = {value:'',cb:null};
function openPinAuth(cb){ pinState={value:'',cb}; openModal(renderPin()); }
function renderPin(){
  return sheetWrap('Vérification requise', `
    <p style="color:var(--muted);font-size:13px;margin:-6px 0 4px;">Entrez votre code PIN à 4 chiffres pour afficher les informations sensibles.</p>
    <div class="pin-dots">${[0,1,2,3].map(i=>`<div class="pd ${pinState.value.length>i?'filled':''}"></div>`).join('')}</div>
    <div class="keypad">
      ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" onclick="pinPress('${n}')">${n}</button>`).join('')}
      <div class="key ghost"></div>
      <button class="key" onclick="pinPress('0')">0</button>
      <button class="key ghost" onclick="pinBack()">${icon('back',18)}</button>
    </div>`);
}
function pinPress(d){
  if(pinState.value.length>=4) return;
  pinState.value+=d;
  if(pinState.value.length===4){ setTimeout(()=>{ closeModal(); pinState.cb&&pinState.cb(); toast('Identité vérifiée'); },250); }
  openModal(renderPin());
}
function pinBack(){ pinState.value=pinState.value.slice(0,-1); openModal(renderPin()); }

let transferTab='envoyer';
let tfState={number:'',amount:'',target:null};
function renderTransferts(){
  const u = user();
  return `
  <div class="tab-switch">

    <button class="btn-primary" onclick="lookupTransfer()">Continuer</button>
    <div class="section-title">Historique</div>
    <div class="list-card">${u.transactions.filter(t=>t.cat==='Transfert').slice(0,6).map(txRow).join('')||`<div class="empty-state" style="padding:26px;"><p>Aucun transfert récent.</p></div>`}</div>
  ` : `

    </div>
    <p style="text-align:center;color:var(--muted);font-size:12.5px;">Communiquez ce numéro à la personne qui souhaite vous transférer de l'argent.</p>
  `}
  `;
}
function setTransferTab(t){ transferTab=t; renderRoot(); }
function copyNumber(){ toast('Numéro copié'); }
function toggleFieldType(id,btn){
  const inp = document.getElementById(id);
  const show = inp.type==='password';
  inp.type = show ? 'text' : 'password';
  btn.innerHTML = icon(show?'eyeOff':'eye',17);
}
function lookupTransfer(){
  const num = document.getElementById('tf-num').value.trim();
  const amt = parseFloat(document.getElementById('tf-amt').value);
  if(num.length!==6){ toast('Le numéro doit contenir 6 chiffres'); return; }
  if(num===user().number){ toast('Vous ne pouvez pas vous transférer à vous-même'); return; }
  const target = ACCOUNTS[num];
  if(!target){ toast('Aucun compte trouvé avec ce numéro'); return; }
  if(!amt||amt<=0){ toast('Montant invalide'); return; }
  if(amt>user().balance){ toast('Solde insuffisant'); return; }
  tfState={number:num,amount:amt,target};
  openModal(sheetWrap('Confirmer le transfert', `
    <div class="result-wrap" style="padding-top:6px;">
      <div class="cur-badge" style="width:52px;height:52px;margin:0 auto 14px;">${icon('send',22)}</div>
      <p style="font-size:14.5px;color:var(--ink);margin:0 0 4px;">Tu veux transférer</p>
      <p style="font-family:'Manrope';font-weight:800;font-size:26px;margin:0 0 4px;" class="tnum">${money(amt)}</p>
      <p style="font-size:14.5px;color:var(--ink);">à <b>${target.name}</b> ?</p>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
      <button class="btn-secondary" style="margin-top:0;" onclick="closeModal()">Annuler la transaction</button>
      <button class="btn-primary" style="margin-top:0;" onclick="executeTransfer()">Confirmer la transaction</button>
    </div>
  `));
}
async function executeTransfer(){
  const u = user(); const {amount,target} = tfState;
  const id = genId('HB'); const rxId = genId('HB');
  u.balance -= amount;
  target.balance += amount;
  const txOut = {id,label:todayStr(),desc:'Transfert vers '+target.name,cat:'Transfert',amount:-amount,date:new Date()};
  const txIn = {id:rxId,label:todayStr(),desc:'Reçu de '+u.name,cat:'Reçu',amount:amount,date:new Date()};
  const notif = {id:genId('N'),text:`Vous avez reçu ${fmt(amount)} de ${u.name}.`,date:new Date(),read:false};
  u.transactions.unshift(txOut);
  target.transactions.unshift(txIn);
  target.notifications.unshift(notif);
  await Promise.all([
    sb.from('accounts').update({balance:u.balance}).eq('number',u.number),
    sb.from('accounts').update({balance:target.balance}).eq('number',target.number),
    sb.from('transactions').insert({id:txOut.id, account_number:u.number, description:txOut.desc, category:txOut.cat, amount:txOut.amount}),
    sb.from('transactions').insert({id:txIn.id, account_number:target.number, description:txIn.desc, category:txIn.cat, amount:txIn.amount}),
    sb.from('notifications').insert({id:notif.id, account_number:target.number, text:notif.text, read:false}),
  ]);
  tfState={number:'',amount:'',target:null};
  openModal(`
    <div class="result-wrap">
      <div class="result-check">${icon('check',32)}</div>
      <h2>Félicitations !</h2>
      <p>Vous avez transféré <b class="tnum">${money(amount)}</b> à <b>${target.name}</b>.</p>
      <div class="summary-box" style="text-align:left;">
        <div class="summary-row"><span>Référence</span><b>${id}</b></div>
        <div class="summary-row"><span>Nouveau solde</span><b class="tnum">${money(u.balance)}</b></div>
      </div>
    </div>
    <button class="btn-primary" onclick="closeModal();renderRoot()">OK</button>`);
}

async function submitRecharge(method){
  const amt = parseFloat(document.getElementById('rc-amt').value);
  const ref = document.getElementById('rc-ref').value.trim();
  if(!amt||amt<=0){ toast('Montant invalide'); return; }
  const u = user();
  const id = genId('RC');
  const req = {id,accountNumber:u.number,name:u.name,method,amount:amt,ref:ref||'—',status:'pending',date:new Date()};
  RECHARGE_REQUESTS.unshift(req);
  const notif = {id:genId('N'),text:`Votre demande de recharge ${method} de ${fmt(amt)} a été envoyée à l'administration.`,date:new Date(),read:false};
  u.notifications.unshift(notif);
  await Promise.all([
    sb.from('recharge_requests').insert({id, account_number:u.number, method, amount:amt, ref:req.ref, status:'pending'}),
    sb.from('notifications').insert({id:notif.id, account_number:u.number, text:notif.text, read:false}),
  ]);
  closeModal();
  openModal(`<div class="result-wrap"><div class="result-check">${icon('check',30)}</div><h2>Demande envoyée</h2><p>Référence : ${id}. En attente de validation par l'administration.</p><button class="btn-primary" onclick="closeModal();renderRoot()">OK</button></div>`);
}
function openWithdraw(){
  openModal(sheetWrap('Retirer de l’argent', `
    <div class="field"><label>Montant à retirer</label><input id="wd-amt" type="number" placeholder="0" oninput="updateWdFee()"></div>
    <div class="summary-box">
      <div class="summary-row"><span>Frais</span><b id="wd-fee-line" class="tnum">${money(0)}</b></div>
      <div class="summary-row"><span>Total débité</span><b id="wd-total-line" class="tnum">${money(0)}</b></div>
    </div>
    <p style="color:var(--muted);font-size:11.5px;">Des frais s'appliquent à partir de $500 (2%). Aucun montant n'est débité tant que l'administration n'a pas confirmé le retrait.</p>
    <button class="btn-primary" onclick="submitWithdraw()">Envoyer la demande de retrait</button>
  `));
}
function withdrawFee(amt){ return amt>=500 ? +(amt*0.02).toFixed(2) : 0; }
function updateWdFee(){
  const amt = parseFloat(document.getElementById('wd-amt').value)||0;
  const fee = withdrawFee(amt);
  document.getElementById('wd-fee-line').innerHTML = money(fee);
  document.getElementById('wd-total-line').innerHTML = money(amt+fee);
}
async function submitWithdraw(){
  const amt = parseFloat(document.getElementById('wd-amt').value);
  if(!amt||amt<=0){ toast('Montant invalide'); return; }
  const u = user();
  const fee = withdrawFee(amt);
  if(amt+fee>u.balance){ toast('Solde insuffisant pour ce retrait'); return; }
  const id = genId('WD');
  WITHDRAW_REQUESTS.unshift({id,accountNumber:u.number,name:u.name,amount:amt,fee,total:amt+fee,status:'pending',date:new Date()});
  const notif = {id:genId('N'),text:`Votre demande de retrait de ${fmt(amt)} a été envoyée à l'administration.`,date:new Date(),read:false};
  u.notifications.unshift(notif);
  await Promise.all([
    sb.from('withdraw_requests').insert({id, account_number:u.number, amount:amt, fee, total:amt+fee, status:'pending'}),
    sb.from('notifications').insert({id:notif.id, account_number:u.number, text:notif.text, read:false}),
  ]);
  closeModal();
  openModal(`<div class="result-wrap"><div class="result-check">${icon('check',30)}</div><h2>Demande envoyée</h2><p>Référence : ${id}. Aucun montant n'a encore été débité.</p><button class="btn-primary" onclick="closeModal();renderRoot()">OK</button></div>`);
}

async function handleRequest(kind,id,approve){
  const list = kind==='Recharge' ? RECHARGE_REQUESTS : WITHDRAW_REQUESTS;
  const table = kind==='Recharge' ? 'recharge_requests' : 'withdraw_requests';
  const req = list.find(r=>r.id===id);
  if(!req) return;
  const acc = ACCOUNTS[req.accountNumber];
  if(approve){
    if(kind==='Recharge'){
      acc.balance += req.amount;
      const tx = {id:genId('HB'),label:todayStr(),desc:'Recharge '+req.method+' approuvée',cat:'Dépôt',amount:req.amount,date:new Date()};
      acc.transactions.unshift(tx);
      const notif = {id:genId('N'),text:`Votre recharge de ${fmt(req.amount)} a été approuvée.`,date:new Date(),read:false};
      acc.notifications.unshift(notif);
      await Promise.all([
        sb.from('accounts').update({balance:acc.balance}).eq('number',acc.number),
        sb.from('transactions').insert({id:tx.id, account_number:acc.number, description:tx.desc, category:tx.cat, amount:tx.amount}),
        sb.from('notifications').insert({id:notif.id, account_number:acc.number, text:notif.text, read:false}),
      ]);
    } else {
      if(acc.balance < req.total){ toast('Solde du compte insuffisant, refus automatique'); req.status='rejected'; await sb.from(table).update({status:'rejected'}).eq('id',id); renderRoot(); return; }
      acc.balance -= req.total;
      const tx = {id:genId('HB'),label:todayStr(),desc:'Retrait approuvé',cat:'Retrait',amount:-req.total,date:new Date()};
      acc.transactions.unshift(tx);
      const notif = {id:genId('N'),text:`Votre retrait de ${fmt(req.amount)} a été approuvé.`,date:new Date(),read:false};
      acc.notifications.unshift(notif);
      await Promise.all([
        sb.from('accounts').update({balance:acc.balance}).eq('number',acc.number),
        sb.from('transactions').insert({id:tx.id, account_number:acc.number, description:tx.desc, category:tx.cat, amount:tx.amount}),
        sb.from('notifications').insert({id:notif.id, account_number:acc.number, text:notif.text, read:false}),
      ]);
    }
    req.status='approved';
    await sb.from(table).update({status:'approved'}).eq('id',id);
  } else {
    req.status='rejected';
    const notif = {id:genId('N'),text:`Votre demande de ${kind.toLowerCase()} (${fmt(req.amount)}) a été refusée.`,date:new Date(),read:false};
    acc.notifications.unshift(notif);
    await Promise.all([
      sb.from(table).update({status:'rejected'}).eq('id',id),
      sb.from('notifications').insert({id:notif.id, account_number:acc.number, text:notif.text, read:false}),
    ]);
  }
  renderRoot(); toast(approve?'Demande approuvée':'Demande refusée');
}

/* =========================================================
   CHARTS — flux qui "tick" en continu (démo)
========================================================= */
function pushSeries(){
  const last = state.financeSeries[state.financeSeries.length-1];
  let next = last + (Math.random()*16-8);
  next = Math.max(15,Math.min(125,next));
  state.financeSeries.push(next);
  if(state.financeSeries.length>28) state.financeSeries.shift();
  if(state.displaySeries.length<state.financeSeries.length) state.displaySeries.push(next);
}
const CHART_HEIGHTS = {'mini-chart':90,'finance-chart':170,'admin-chart':170,'role-chart':120};
function setupCanvas(cv){
  const w = Math.min(Math.max(cv.parentElement.clientWidth||300, 60), window.innerWidth-20);
  const h = CHART_HEIGHTS[cv.id] || 110;
  const dpr = window.devicePixelRatio||1;
  cv.width = w*dpr; cv.height = h*dpr;
  cv.style.width = w+'px'; cv.style.height = h+'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w,h};
}
function drawLineFlux(id,data,color,fillColor){
  const cv = document.getElementById(id);
  if(!cv) return;
  const {ctx,w,h} = setupCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const min=Math.min(...data), max=Math.max(...data), pad=8;
  const range = (max-min)||1;
  const stepX = (w-pad*2)/(data.length-1);
  const pts = data.map((v,i)=>[pad+i*stepX, h-pad-((v-min)/range)*(h-pad*2)]);
  ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){
    const [x0,y0]=pts[i-1], [x1,y1]=pts[i];
    const mx=(x0+x1)/2;
    ctx.bezierCurveTo(mx,y0,mx,y1,x1,y1);
  }
  ctx.lineTo(pts[pts.length-1][0],h);
  ctx.lineTo(pts[0][0],h);
  ctx.closePath();
  ctx.fillStyle = fillColor;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){
    const [x0,y0]=pts[i-1], [x1,y1]=pts[i];
    const mx=(x0+x1)/2;
    ctx.bezierCurveTo(mx,y0,mx,y1,x1,y1);
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.stroke();
  const last = pts[pts.length-1];
  ctx.beginPath(); ctx.arc(last[0],last[1],4,0,Math.PI*2);
  ctx.fillStyle = color; ctx.fill();
}
function drawDoughnutChart(id,data,colors){
  const cv = document.getElementById(id);
  if(!cv) return;
  const {ctx,w,h} = setupCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const total = data.reduce((a,b)=>a+b,0) || 1;
  const cx=w/2, cy=h/2, r=Math.min(w,h)/2-4, inner=r*0.6;
  let start=-Math.PI/2;
  data.forEach((v,i)=>{
    const angle = (v/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.arc(cx,cy,inner,start+angle,start,true);
    ctx.closePath();
    ctx.fillStyle = colors[i%colors.length];
    ctx.fill();
    start += angle;
  });
}
function drawCharts(){
  drawLineFlux('mini-chart', state.displaySeries, '#0A1B3D', 'rgba(10,27,61,.15)');
  drawLineFlux('finance-chart', state.displaySeries, '#0A1B3D', 'rgba(10,27,61,.15)');
  drawLineFlux('admin-chart', state.displaySeries, '#0A1B3D', 'rgba(10,27,61,.15)');
  drawDoughnutChart('role-chart', [roleCount('eleve'),roleCount('professeur'),roleCount('personnel'),roleCount('direction')], ['#0C2350','#2748A0','#3E5FC4','#8FA6F5']);
}
function ensureTicker(){
  if(financeTimer) return;
  financeTimer = setInterval(pushSeries, 1500);
  function frame(){
    // smoothly ease displaySeries toward financeSeries every animation frame
    for(let i=0;i<state.financeSeries.length;i++){
      const target = state.financeSeries[i];
      const cur = state.displaySeries[i] ?? target;
      state.displaySeries[i] = cur + (target-cur)*0.06;
    }
    while(state.displaySeries.length>state.financeSeries.length) state.displaySeries.shift();
    drawLineFlux('mini-chart', state.displaySeries, '#0A1B3D', 'rgba(10,27,61,.15)');
    drawLineFlux('finance-chart', state.displaySeries, '#0A1B3D', 'rgba(10,27,61,.15)');
    drawLineFlux('admin-chart', state.displaySeries, '#0A1B3D', 'rgba(10,27,61,.15)');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* =========================================================
   SPLASH + ROOT RENDER
========================================================= */
function renderRoot(){
  const root=document.getElementById('root');
  root.innerHTML = state.session ? renderShell() : renderAuthOrParent();
  if(!state.notifOpen) document.getElementById('modal-root').classList.remove('open');
  requestAnimationFrame(()=>{ drawCharts(); ensureTicker(); });
}
function renderAuthOrParent(){
  if(auth.view==='parent-info') return renderParentInfo();
  return renderAuth();
}

async function boot(){
  renderRoot();
  try{ await loadFromSupabase(); }catch(e){ console.error('Supabase load failed', e); toast('Connexion au serveur impossible — mode hors-ligne'); }
  renderRoot();
  startRealtime();
}
window.addEventListener('load', ()=>{
  boot();
  setTimeout(()=>{
    const sp = document.getElementById('splash');
    sp.classList.add('fade');
    setTimeout(()=>sp.remove(),500);
  },3000);
});
</script>
</body>
</html>
