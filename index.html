<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>HUMA BANK</title>

<!-- PWA — comportement app installée, aucune barre de navigateur -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0C2350">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS : mode plein écran une fois ajouté à l'écran d'accueil -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HUMA BANK">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --gold:#C79B3B;
  --gold-light:#E8C468;
  --navy-950:#040B18;
  --navy-900:#081831;
  --navy-800:#0C2350;
  --navy-700:#153274;
  --navy-600:#2748A0;
  --navy-500:#3E5FC4;
  --navy-100:#E8EDF8;
  --navy-50:#F3F6FC;
  --white:#FFFFFF;
  --surface:#FFFFFF;
  --ink:#0A1B3D;
  --muted:#647096;
  --muted-2:#8792B0;
  --line:#E2E8F5;
  --pos:#1B8F5A;
  --pos-bg:#E7F6EE;
  --neg:#C4433F;
  --neg-bg:#FBEAEA;
  --r-lg:24px;
  --r-md:16px;
  --r-sm:11px;
  --shadow-card:0 18px 34px -16px rgba(8,24,63,.35);
  --shadow-soft:0 8px 20px -10px rgba(8,24,63,.18);
}
.dark{
  --navy-50:#0A1631;
  --surface:#101F42;
  --white:#0F1D3D;
  --ink:#EDF1FF;
  --muted:#96A3CC;
  --muted-2:#7684AC;
  --line:#213259;
  --navy-100:#152548;
  --pos-bg:#123326;
  --neg-bg:#37191A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',sans-serif;
  background:var(--navy-950);
  color:var(--ink);
  min-height:100vh;
}
#root{display:flex;justify-content:center;width:100%;min-height:100vh;}
h1,h2,h3,.display{font-family:'Manrope',sans-serif;}
button{font-family:inherit;cursor:pointer;}
.tnum{font-variant-numeric:tabular-nums;}
::-webkit-scrollbar{width:0;height:0;}

.phone{
  width:100%;
  max-width:430px;
  min-height:100vh;
  background:var(--navy-50);
  display:flex;
  flex-direction:column;
  position:relative;
  box-shadow:0 0 80px rgba(0,0,0,.5);
}

/* ---------- LOGIN ---------- */
.login-wrap{
  width:100%;max-width:430px;min-height:100vh;
  background:radial-gradient(120% 100% at 50% 0%, var(--navy-700) 0%, var(--navy-900) 55%, var(--navy-950) 100%);
  color:#fff;padding:56px 26px 40px;display:flex;flex-direction:column;
}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.login-brand .mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#fff,#B9C8F2);display:flex;align-items:center;justify-content:center;color:var(--navy-900);font-weight:800;font-family:'Manrope';font-size:16px;}
.login-brand span{font-family:'Manrope';font-weight:800;font-size:19px;letter-spacing:.2px;}
.login-tag{color:#A9B8E4;font-size:14px;margin:0 0 40px;}
.login-hero{font-family:'Manrope';font-weight:800;font-size:28px;line-height:1.25;margin:0 0 6px;}
.login-sub{color:#A9B8E4;font-size:14.5px;margin:0 0 34px;}
.login-list{display:flex;flex-direction:column;gap:10px;}
.login-item{
  display:flex;align-items:center;gap:13px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(6px);
  border-radius:16px;padding:13px 15px;text-align:left;color:#fff;
  transition:.15s;
}
.login-item:active{transform:scale(.98);background:rgba(255,255,255,.12);}
.login-avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;color:#fff;}
.login-item .li-name{font-weight:700;font-size:14.5px;}
.login-item .li-role{color:#A9B8E4;font-size:12.5px;margin-top:1px;}
.login-item .chev{margin-left:auto;opacity:.6;}
.login-foot{margin-top:auto;padding-top:30px;color:#7C8BC0;font-size:11.5px;text-align:center;line-height:1.6;}

/* ---------- SHELL ---------- */
.header{
  position:sticky;top:0;z-index:20;background:var(--navy-50);
  display:flex;align-items:center;gap:12px;padding:16px 18px 12px;
}
.dark .header{background:var(--navy-50);}
.avatar{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;
  font-family:'Manrope';
}
.header-mid{flex:1;min-width:0;}
.header-greet{font-size:13px;color:var(--muted);margin:0;}
.header-name{font-family:'Manrope';font-weight:800;font-size:16.5px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.icon-btn{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;flex-shrink:0;
}
.icon-btn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--neg);border:1.5px solid var(--surface);}

.screen{flex:1;overflow-y:auto;padding:4px 18px 110px;}

.bottomnav{
  position:sticky;bottom:0;z-index:20;background:var(--surface);
  border-top:1px solid var(--line);order:1;
  display:flex;padding:9px 6px calc(9px + env(safe-area-inset-bottom));
}
.nav-btn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted-2);padding:5px 2px;border-radius:12px;}
.nav-btn.active{color:var(--navy-700);}
.dark .nav-btn.active{color:#8FA6F5;}
.nav-btn span{font-size:10.5px;font-weight:600;}

/* ---------- CARDS / SECTIONS ---------- */
.section-title{font-family:'Manrope';font-weight:800;font-size:15px;margin:22px 0 12px;display:flex;align-items:center;justify-content:space-between;}
.section-title .link{font-family:'Inter';font-weight:600;font-size:12.5px;color:var(--navy-600);}
.dark .section-title .link{color:#8FA6F5;}

.balance-card{
  background:linear-gradient(135deg,var(--navy-900) 0%, var(--navy-700) 100%);
  border-radius:var(--r-lg);padding:22px 22px 20px;color:#fff;position:relative;overflow:hidden;
  box-shadow:var(--shadow-card);margin-top:10px;
}
.balance-card::before{content:'';position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%);top:-90px;right:-60px;}
.balance-card::after{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.07),transparent 70%);bottom:-70px;left:-40px;}
.bc-row{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;}
.bc-label{font-size:12.5px;color:#B9C6EE;margin:0 0 6px;}
.bc-amount{font-family:'Manrope';font-weight:800;font-size:32px;letter-spacing:.3px;}
.bc-toggle{background:rgba(255,255,255,.14);border:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;}
.bc-acct{font-size:12px;color:#B9C6EE;margin-top:14px;letter-spacing:.5px;position:relative;z-index:1;}

.quick-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:18px;}
.qa-btn{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink);}
.qa-btn .qi{width:38px;height:38px;border-radius:12px;background:var(--navy-100);display:flex;align-items:center;justify-content:center;color:var(--navy-700);}
.dark .qa-btn .qi{color:#8FA6F5;}
.qa-btn span{font-size:11px;font-weight:600;}

.list-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;}
.tx-row{display:flex;align-items:center;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);}
.tx-row:last-child{border-bottom:none;}
.tx-icn{width:38px;height:38px;border-radius:11px;background:var(--navy-100);display:flex;align-items:center;justify-content:center;color:var(--navy-700);flex-shrink:0;}
.dark .tx-icn{color:#8FA6F5;}
.tx-mid{flex:1;min-width:0;}
.tx-desc{font-size:13.5px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tx-cat{font-size:11.5px;color:var(--muted);margin:2px 0 0;}
.tx-amt{font-weight:700;font-size:13.5px;}
.tx-amt.pos{color:var(--pos);}
.tx-amt.neg{color:var(--ink);}
.tx-date{font-size:10.5px;color:var(--muted-2);margin-top:2px;text-align:right;}

.mini-chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-top:14px;min-width:0;overflow:hidden;}
.mini-chart-card canvas,.chart-card canvas{max-width:100%;display:block;}
.mini-chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.mini-chart-head h4{margin:0;font-size:13px;font-family:'Manrope';font-weight:800;}
.mini-chart-head .val{font-size:12px;color:var(--pos);font-weight:700;}

.notif-banner{display:flex;gap:11px;background:var(--navy-100);border-radius:var(--r-md);padding:13px 14px;margin-top:14px;align-items:flex-start;}
.dark .notif-banner{background:var(--navy-100);}
.notif-banner .ic{color:var(--navy-700);flex-shrink:0;margin-top:1px;}
.dark .notif-banner .ic{color:#8FA6F5;}
.notif-banner p{margin:0;font-size:12.5px;line-height:1.5;}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;margin-top:8px;}
.chip{flex-shrink:0;border:1px solid var(--line);background:var(--surface);border-radius:30px;padding:9px 15px;font-size:12.5px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;}
.chip.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}
.chip .cdot{width:7px;height:7px;border-radius:50%;}

/* CARD (bank card visual) */
.bank-card{
  background:linear-gradient(135deg,var(--navy-950) 0%, var(--navy-800) 55%, var(--navy-600) 130%);
  border-radius:20px;padding:20px 78px 20px 20px;color:#fff;position:relative;overflow:hidden;
  aspect-ratio:1.586;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:var(--shadow-card);
}
.bank-card.frozen{filter:grayscale(.85) brightness(.8);}
.bank-card::before{content:'';position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.09),transparent 70%);top:-80px;right:-50px;}
.bc-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
.bc-top .bank-name{font-family:'Manrope';font-weight:800;font-size:18px;letter-spacing:.3px;}
.bc-top .ctype{font-size:11px;color:#8FB3F0;margin-top:3px;}
.chip-icon{width:34px;height:24px;border-radius:5px;background:linear-gradient(135deg,#E8C468,#C79B3B);}
.bc-number{font-family:'Manrope';font-weight:700;font-size:16.5px;letter-spacing:2.5px;position:relative;z-index:1;}
.bc-bottom{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1;}
.bc-holder{font-size:16px;font-weight:600;letter-spacing:.2px;}
.bc-exp{font-size:10.5px;color:#B9C6EE;margin-top:3px;}
.bc-divider{position:absolute;top:16px;bottom:16px;right:52px;width:2px;background:rgba(255,255,255,.9);z-index:1;}
.bc-network-vert{position:absolute;top:0;bottom:0;right:10px;width:36px;display:flex;align-items:center;justify-content:center;z-index:1;}
.bc-network-vert span{writing-mode:vertical-rl;font-family:'Manrope';font-weight:800;font-size:15px;letter-spacing:3px;color:#fff;}
.frozen-badge{position:absolute;top:14px;right:14px;background:rgba(0,0,0,.5);font-size:9.5px;padding:4px 9px;border-radius:20px;font-weight:700;letter-spacing:.5px;z-index:2;}

.card-add-btn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--navy-800);color:#fff;border:none;border-radius:var(--r-md);padding:15px;font-weight:700;font-size:13.5px;width:100%;margin-top:16px;}
.card-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
.meta-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 13px;}
.meta-box .ml{font-size:11px;color:var(--muted);margin:0 0 4px;}
.meta-box .mv{font-size:14px;font-weight:700;margin:0;}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.act-btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:12px;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:7px;color:var(--ink);}
.act-btn.danger{color:var(--neg);}
.act-btn.primary{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}

.limit-row{margin-top:14px;}
.limit-row .lr-head{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;}
.limit-row .lr-head b{font-weight:700;}
input[type=range]{width:100%;accent-color:var(--navy-700);}

/* PAYMENTS GRID */
.pay-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px;}
.pay-tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.pay-tile .pi{width:42px;height:42px;border-radius:13px;background:var(--navy-100);display:flex;align-items:center;justify-content:center;color:var(--navy-700);}
.dark .pay-tile .pi{color:#8FA6F5;}
.pay-tile span{font-size:11px;font-weight:700;line-height:1.3;}
.pay-tile small{font-size:9.5px;color:var(--muted);}

.scan-card{background:linear-gradient(135deg,var(--navy-800),var(--navy-600));border-radius:var(--r-md);padding:16px;color:#fff;display:flex;align-items:center;gap:13px;margin-top:14px;}
.scan-card .si{width:44px;height:44px;border-radius:13px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.scan-card b{font-size:13.5px;display:block;}
.scan-card small{color:#B9C6EE;font-size:11.5px;}
.scan-card .go{margin-left:auto;background:#fff;color:var(--navy-800);border:none;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* TRANSFERS */
.tab-switch{display:flex;background:var(--navy-100);border-radius:14px;padding:4px;margin-top:6px;}
.tab-switch button{flex:1;border:none;background:none;padding:10px;border-radius:11px;font-weight:700;font-size:12.5px;color:var(--muted);}
.tab-switch button.active{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-soft);}
.benef-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);}
.benef-row:last-child{border-bottom:none;}
.benef-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12.5px;flex-shrink:0;}
.benef-mid{flex:1;}
.benef-mid b{font-size:13.5px;display:block;}
.benef-mid small{color:var(--muted);font-size:11.5px;}
.add-benef{display:flex;align-items:center;gap:12px;padding:13px 4px;color:var(--navy-700);font-weight:700;font-size:13px;}
.dark .add-benef{color:#8FA6F5;}
.add-benef .aic{width:40px;height:40px;border-radius:50%;border:1.5px dashed var(--navy-600);display:flex;align-items:center;justify-content:center;flex-shrink:0;}

/* FINANCES */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.stat-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;}
.stat-box .sl{font-size:11.5px;color:var(--muted);margin:0 0 6px;display:flex;align-items:center;gap:6px;}
.stat-box .sv{font-family:'Manrope';font-weight:800;font-size:19px;margin:0;}
.stat-box .sv.pos{color:var(--pos);}
.stat-box .sv.neg{color:var(--neg);}
.period-row{display:flex;gap:7px;margin-top:16px;}
.period-btn{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:9px;font-size:12px;font-weight:700;color:var(--muted);}
.period-btn.active{background:var(--navy-800);color:#fff;border-color:var(--navy-800);}
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-top:14px;min-width:0;overflow:hidden;}
.cat-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.cat-row:last-child{border-bottom:none;}
.cat-dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.cat-row b{font-size:12.5px;flex:1;font-weight:600;}
.cat-row span{font-size:12.5px;font-weight:700;}

/* PROFILE */
.profile-head{display:flex;flex-direction:column;align-items:center;padding:14px 0 6px;}
.profile-head .pav{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:24px;font-family:'Manrope';margin-bottom:12px;}
.profile-head h3{margin:0;font-size:17px;}
.profile-head p{margin:3px 0 0;font-size:12.5px;color:var(--muted);}
.settings-group{margin-top:20px;}
.settings-label{font-size:11.5px;font-weight:700;color:var(--muted-2);text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px 4px;}
.settings-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);padding:13px 14px;}
.settings-item:first-of-type{border-radius:14px 14px 0 0;}
.settings-item:last-of-type{border-radius:0 0 14px 14px;border-top:none;}
.settings-item:only-of-type{border-radius:14px;}
.settings-item + .settings-item{border-top:none;}
.settings-item .sic{width:34px;height:34px;border-radius:10px;background:var(--navy-100);display:flex;align-items:center;justify-content:center;color:var(--navy-700);flex-shrink:0;}
.dark .settings-item .sic{color:#8FA6F5;}
.settings-item .stx{flex:1;font-size:13.5px;font-weight:600;}
.settings-item small{display:block;color:var(--muted);font-weight:400;font-size:11px;margin-top:1px;}
.toggle{width:42px;height:24px;border-radius:20px;background:var(--line);position:relative;border:none;flex-shrink:0;transition:.2s;}
.toggle.on{background:var(--navy-700);}
.toggle::after{content:'';position:absolute;width:19px;height:19px;background:#fff;border-radius:50%;top:2.5px;left:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.toggle.on::after{left:20px;}
.logout-btn{width:100%;margin-top:22px;background:var(--neg-bg);color:var(--neg);border:none;border-radius:14px;padding:14px;font-weight:700;font-size:13.5px;display:flex;align-items:center;justify-content:center;gap:8px;}

/* ADMIN */
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.kpi-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px;}
.kpi-box .kl{font-size:11px;color:var(--muted);margin:0 0 5px;}
.kpi-box .kv{font-family:'Manrope';font-weight:800;font-size:20px;margin:0;}
.kpi-box .kd{font-size:10.5px;margin-top:4px;font-weight:700;}
.table-wrap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-top:10px;}
.trow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);}
.trow:last-child{border-bottom:none;}
.trow .tleft{flex:1;min-width:0;}
.trow .tleft b{font-size:12.5px;display:block;}
.trow .tleft small{font-size:11px;color:var(--muted);}
.badge{font-size:10px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;}
.badge.ok{background:var(--pos-bg);color:var(--pos);}
.badge.pending{background:#FDF3DC;color:#A9761B;}
.badge.fail{background:var(--neg-bg);color:var(--neg);}
.filter-row{display:flex;gap:7px;overflow-x:auto;margin-top:12px;}
.search-box{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-top:10px;color:var(--muted);}
.search-box input{border:none;background:none;outline:none;flex:1;font-size:13px;color:var(--ink);font-family:inherit;}

/* MODAL — always centered, on every screen size, no media-query dependency */
.modal-root{position:fixed;top:0;left:0;right:0;bottom:0;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px;pointer-events:none;}
.modal-root.open{pointer-events:auto;}
.modal-backdrop{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(4,11,24,.55);opacity:0;transition:opacity .2s;}
.modal-root.open .modal-backdrop{opacity:1;}
.modal-sheet{
  position:relative;width:100%;max-width:430px;background:var(--navy-50);border-radius:22px;
  padding:22px 20px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto;
  transform:scale(.94);opacity:0;transition:transform .2s ease, opacity .2s ease;
}
.modal-root.open .modal-sheet{transform:scale(1);opacity:1;}
.sheet-handle{display:none;}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.sheet-head h3{margin:0;font-size:16.5px;}
.sheet-close{width:32px;height:32px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px;}
.field input,.field select{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;
  font-size:14px;font-family:inherit;color:var(--ink);outline:none;
}
.field input:focus,.field select:focus{border-color:var(--navy-600);}
.amount-input{font-family:'Manrope';font-weight:800;font-size:34px;text-align:center;border:none;background:none;width:100%;outline:none;color:var(--ink);}
.seg{display:flex;gap:8px;flex-wrap:wrap;}
.seg-opt{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:12.5px;font-weight:700;color:var(--ink);flex:1;min-width:100px;text-align:center;}
.seg-opt.active{border-color:var(--navy-700);background:var(--navy-100);color:var(--navy-800);}
.dark .seg-opt.active{color:#8FA6F5;}
.btn-primary{width:100%;background:var(--navy-800);color:#fff;border:none;border-radius:14px;padding:15px;font-weight:700;font-size:14px;margin-top:6px;}
.btn-primary:disabled{opacity:.45;}
.btn-secondary{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:15px;font-weight:700;font-size:14px;margin-top:10px;}
.summary-box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;}
.summary-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;}
.summary-row b{font-weight:700;}
.summary-row + .summary-row{border-top:1px solid var(--line);}

.result-wrap{text-align:center;padding:14px 6px 4px;}
.result-check{width:70px;height:70px;border-radius:50%;background:var(--pos-bg);color:var(--pos);display:flex;align-items:center;justify-content:center;margin:6px auto 18px;}
.result-wrap h2{font-size:20px;margin:0 0 6px;}
.result-wrap p{color:var(--muted);font-size:13px;margin:0 0 20px;}
.result-amount{font-family:'Manrope';font-weight:800;font-size:30px;margin-bottom:22px;}

.pin-dots{display:flex;justify-content:center;gap:14px;margin:26px 0 18px;}
.pin-dots .pd{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--muted-2);}
.pin-dots .pd.filled{background:var(--navy-700);border-color:var(--navy-700);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.key{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;font-size:19px;font-weight:700;text-align:center;}
.key.ghost{background:none;border:none;}

.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--navy-900);color:#fff;padding:12px 20px;border-radius:30px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;align-items:center;gap:8px;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}

.empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
.empty-state .es-ic{width:60px;height:60px;border-radius:50%;background:var(--navy-100);color:var(--navy-700);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.empty-state .es-ic-ring{box-shadow:0 0 0 3px var(--navy-50), 0 0 0 4.5px var(--gold-light);}
.dark .empty-state .es-ic{color:#8FA6F5;}
.empty-state h4{margin:0 0 6px;color:var(--ink);}
.empty-state p{margin:0;font-size:12.5px;}

.hidden{display:none !important;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:42px;}
.pw-eye{position:absolute;right:8px;top:32px;background:none;border:none;color:var(--muted);padding:6px;display:flex;}
.login-wrap .pw-eye{color:#B9C6EE;}

/* CURRENCY ICON (replaces $ in display text) */
.cur{height:1.05em;width:auto;vertical-align:-0.15em;display:inline-block;filter:brightness(0) saturate(100%);margin-right:2px;}
.cur.on-dark{filter:none;}
.cur-badge{display:inline-flex;align-items:center;justify-content:center;width:1.5em;height:1.5em;border-radius:50%;background:var(--navy-800);flex-shrink:0;}
.cur-badge img{height:0.85em;filter:none;}

/* SPLASH — tracé progressif "HUMA BANK" (bleu marine + blanc) */
#splash{position:fixed;inset:0;z-index:999;background:#0C2350;display:flex;align-items:center;justify-content:center;}
#splash svg{width:min(86vw,540px);height:auto;overflow:visible;}
#splash .hb-letter{
  font-family:'Manrope',sans-serif;font-weight:800;font-size:72px;letter-spacing:1px;
  fill:transparent;stroke:#fff;stroke-width:1.5;
  stroke-dasharray:280;stroke-dashoffset:280;
  animation:hbDraw .9s ease forwards, hbFill .45s ease forwards;
  animation-delay:calc(var(--i) * .17s), calc(1.65s + var(--i) * .04s);
}
@keyframes hbDraw{to{stroke-dashoffset:0;}}
@keyframes hbFill{to{fill:#fff;stroke-width:0;}}
#splash.sp-fadeout{animation:spFadeOut .8s ease forwards;}
@keyframes spFadeOut{from{opacity:1;}to{opacity:0;}}

/* LOADER HUMA — monogramme officiel + anneau animé (tous les chargements) */
.huma-loader{position:relative;width:88px;height:88px;margin:0 auto 18px;}
.huma-loader svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
.huma-loader .hl-track{fill:none;stroke:var(--navy-100);stroke-width:5;}
.huma-loader .hl-arc{fill:none;stroke:var(--navy-700);stroke-width:5;stroke-linecap:round;stroke-dasharray:62 200;animation:hlSpin 1.15s cubic-bezier(.6,.15,.4,.85) infinite;transform-origin:50% 50%;}
.dark .huma-loader .hl-track{stroke:var(--line);}
.dark .huma-loader .hl-arc{stroke:#8FA6F5;}
@keyframes hlSpin{to{transform:rotate(360deg);}}
.huma-loader .hl-mono{position:absolute;top:50%;left:50%;width:36px;height:auto;transform:translate(-50%,-50%);animation:hlPulse 1.6s ease-in-out infinite;filter:brightness(0) saturate(100%);}
.dark .huma-loader .hl-mono{filter:none;}
@keyframes hlPulse{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.88;}50%{transform:translate(-50%,-50%) scale(1.13);opacity:1;}}
.huma-loader-wrap{text-align:center;padding:34px 10px;}
.huma-loader-wrap p{color:var(--muted);font-size:13.5px;margin:0;font-weight:600;}

/* GUIDE INSTALLATION iOS */
/* MESSAGES */
.msg-thread{display:flex;flex-direction:column;gap:8px;min-height:200px;padding-bottom:8px;}
.msg-bubble{max-width:80%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.5;}
.msg-bubble p{margin:0;white-space:pre-wrap;word-break:break-word;}
.msg-bubble small{display:block;margin-top:4px;font-size:10px;opacity:.65;}
.msg-in{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;}
.msg-out{align-self:flex-end;background:var(--navy-800);color:#fff;border-bottom-right-radius:4px;}
.msg-input-row{position:sticky;bottom:0;display:flex;gap:8px;background:var(--navy-50);padding:10px 0 4px;}
.msg-input-row input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:24px;padding:12px 16px;font-size:14px;outline:none;color:var(--ink);}

.ios-install-step{display:flex;align-items:flex-start;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.ios-install-step .ios-step-num{width:26px;height:26px;border-radius:50%;background:var(--navy-800);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;flex-shrink:0;}
.ios-install-step p{margin:0;font-size:13.5px;line-height:1.5;padding-top:2px;}
.ios-pointer-wrap{text-align:center;margin:24px 0;}
.ios-pointer{width:52px;height:52px;border-radius:50%;background:var(--navy-800);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;animation:iosBounce 1.3s ease-in-out infinite;}
.ios-pointer-wrap p{color:var(--muted);font-size:12px;margin:0;}
@keyframes iosBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(8px);}}

/* CARD — realistic normal size */
.bank-card{max-width:360px;margin:0 auto;aspect-ratio:1.586;}
.card-wrap{max-width:360px;margin:0 auto;}

/* LOADING */
.loading-wrap{text-align:center;padding:40px 10px;}
.spinner{width:52px;height:52px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--navy-700);margin:0 auto 20px;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ============================================================
   ANIMATIONS
============================================================ */
/* 2. Transition entre écrans */
@keyframes screenEnter{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.screen-enter{animation:screenEnter .32s cubic-bezier(.22,1,.36,1);}

/* 3. Carte bancaire — tilt 3D + flip pour révéler les infos */
.card-wrap{perspective:900px;}
.bank-card{transition:transform .25s ease, box-shadow .25s ease;transform-style:preserve-3d;}
.bank-card:active{transform:scale(.985) rotateX(2deg);}
@media (hover:hover){
  .card-wrap:hover .bank-card{transform:rotateX(4deg) rotateY(-4deg) scale(1.015);box-shadow:0 26px 50px -18px rgba(8,24,63,.45);}
}
.bank-card.flipping{animation:cardFlip .5s ease;}
.bank-card.flipping-out{animation:cardFlipOut .25s ease forwards;}
@keyframes cardFlipOut{0%{transform:rotateY(0);}100%{transform:rotateY(90deg);}}
@keyframes cardFlip{0%{transform:rotateY(0);}50%{transform:rotateY(90deg);}100%{transform:rotateY(0);}}

/* 4. Entrée des transactions (liste + décalage progressif) */
@keyframes txEnter{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
.tx-enter{animation:txEnter .35s ease both;}

/* 5. Pulsation du point de notification */
@keyframes notifPulse{0%{box-shadow:0 0 0 0 rgba(196,67,63,.55);}70%{box-shadow:0 0 0 7px rgba(196,67,63,0);}100%{box-shadow:0 0 0 0 rgba(196,67,63,0);}}
.icon-btn .dot{animation:notifPulse 1.8s ease-in-out infinite;}

/* 6. Coche animée sur écran de succès */
.result-check svg{overflow:visible;}
.result-check .check-circle{stroke-dasharray:70;stroke-dashoffset:70;animation:checkCircle .45s ease forwards;}
.result-check .check-mark{stroke-dasharray:20;stroke-dashoffset:20;animation:checkMark .3s ease .4s forwards;}
@keyframes checkCircle{to{stroke-dashoffset:0;}}
@keyframes checkMark{to{stroke-dashoffset:0;}}
.result-check{animation:resultPop .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes resultPop{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}

/* 7. Effet d'appui sur les actions rapides */
.qa-btn{transition:transform .12s ease;}
.qa-btn:active{transform:scale(.92);}
.pay-tile{transition:transform .12s ease;}
.pay-tile:active{transform:scale(.95);}
.act-btn{transition:transform .12s ease;}
.act-btn:active{transform:scale(.95);}

/* 8. Anneau de progression — compte à rebours parent */
.countdown-ring{position:relative;width:76px;height:76px;margin:8px auto;}
.countdown-ring svg{transform:rotate(-90deg);width:100%;height:100%;}
.countdown-ring circle{fill:none;stroke-width:5;}
.countdown-ring .cr-bg{stroke:rgba(255,255,255,.15);}
.countdown-ring .cr-fg{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
.countdown-ring .cr-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Manrope';font-weight:800;font-size:20px;color:#fff;}

/* 9. Tracé progressif des graphiques à l'entrée */
@keyframes chartReveal{from{clip-path:inset(0 100% 0 0);}to{clip-path:inset(0 0 0 0);}}
.chart-reveal{animation:chartReveal .8s cubic-bezier(.22,1,.36,1);}

.loading-wrap p{color:var(--muted);font-size:13px;margin:0;}

/* CODE / NUMBER REVEAL */
.code-box{background:var(--surface);border:1.5px dashed var(--navy-600);border-radius:16px;padding:20px;text-align:center;margin:18px 0;}
.code-box .cl{font-size:11.5px;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
.code-box .cv{font-family:'Manrope';font-weight:800;font-size:26px;letter-spacing:6px;margin:0;}

/* NOTIF GROUP HEADER */
.notif-group{font-size:11.5px;font-weight:800;color:var(--muted-2);text-transform:uppercase;letter-spacing:.6px;margin:16px 4px 8px;}
.notif-group:first-child{margin-top:4px;}

.role-hint{background:var(--navy-100);border-radius:14px;padding:16px;font-size:12.5px;line-height:1.6;color:var(--ink);margin-top:6px;}

/* ---------- RESPONSIVE: TABLET / DESKTOP / ANY DEVICE ---------- */
.content-col{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0;overflow:hidden;}
.nav-brand{display:none;}

/* TOUR GUIDÉ — bulles avec flèches pointant sur les vrais éléments */
.tour-target-highlight{position:relative;z-index:997;box-shadow:0 0 0 4px #fff, 0 0 0 6px var(--navy-600), 0 0 0 9999px rgba(4,11,24,.62);border-radius:14px;}
.tour-bubble{position:fixed;z-index:999;background:var(--surface);color:var(--ink);border-radius:16px;padding:15px 16px;width:260px;max-width:calc(100vw - 24px);box-shadow:0 20px 40px -10px rgba(0,0,0,.4);}
.tour-bubble h4{margin:0 0 5px;font-size:13.5px;font-weight:800;font-family:'Manrope';}
.tour-bubble p{margin:0;font-size:12.5px;line-height:1.55;color:var(--muted);}
.tour-bubble .tour-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
.tour-bubble .tour-count{font-size:10.5px;color:var(--muted-2);font-weight:700;}
.tour-bubble .tour-btns{display:flex;gap:12px;}
.tour-bubble button{border:none;background:none;font-size:12px;font-weight:700;cursor:pointer;padding:0;}
.tour-skip-btn{color:var(--muted);}
.tour-next-btn{color:var(--navy-700);}
.dark .tour-next-btn{color:#8FA6F5;}
.tour-arrow{position:absolute;width:13px;height:13px;background:var(--surface);transform:rotate(45deg);}

/* CADENAS — animation pour statut fermé */
.login-item-locked{opacity:.78;}
.lock-anim{position:relative;width:80px;height:88px;margin:10px auto 0;}
.lock-shackle{position:absolute;top:0;left:20px;width:40px;height:36px;border:6px solid #fff;border-bottom:none;border-radius:20px 20px 0 0;animation:shackleClose 1.4s ease-in-out infinite;transform-origin:20px 36px;}
.lock-body{position:absolute;bottom:0;left:8px;width:64px;height:52px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--navy-900);box-shadow:0 10px 24px -8px rgba(0,0,0,.4);}
@keyframes shackleClose{
  0%,100%{transform:rotate(0deg);}
  50%{transform:rotate(-14deg) translateX(-4px);}
}

@media (min-width:760px){
  body{background:var(--navy-50);align-items:stretch;}
  .phone{max-width:100%;width:100%;min-height:100vh;flex-direction:row;box-shadow:none;background:var(--navy-50);}
  .bottomnav{
    order:-1;position:sticky;top:0;flex-direction:column;justify-content:flex-start;align-items:stretch;
    width:92px;height:100vh;border-top:none;border-right:1px solid var(--line);padding:18px 8px;gap:5px;
    flex-shrink:0;
  }
  .nav-brand{display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 4px 20px;}
  .nav-brand .nb-mark{width:32px;height:32px;border-radius:9px;background:var(--navy-800);color:#fff;font-family:'Manrope';font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .nav-brand .nb-text{display:none;font-family:'Manrope';font-weight:800;font-size:14.5px;}
  .nav-btn{border-radius:13px;padding:12px 4px;}
  .nav-btn.active{background:var(--navy-100);}
  .header{padding:22px 34px 12px;max-width:1040px;margin:0 auto;width:100%;}
  .screen{padding:8px 34px 60px;max-width:1040px;margin:0 auto;width:100%;}
  .modal-root{align-items:center;}
  .login-wrap{max-width:100%;width:100%;padding:64px 0 48px;align-items:center;}
  .login-brand,.login-tag,.login-hero,.login-sub,.login-list,.login-foot{width:100%;max-width:430px;}
}

@media (min-width:1080px){
  .bottomnav{width:250px;align-items:stretch;padding:22px 16px;}
  .nav-brand{justify-content:flex-start;padding:6px 10px 24px;}
  .nav-brand .nb-text{display:block;}
  .nav-btn{flex-direction:row;justify-content:flex-start;gap:13px;padding:13px 15px;}
  .nav-btn span{font-size:13px;}
  .header,.screen{max-width:1120px;}
  .quick-actions{max-width:560px;}
  .pay-grid{grid-template-columns:repeat(4,1fr);}
  .kpi-grid,.stat-grid{grid-template-columns:repeat(4,1fr);}
  .bc-amount{font-size:36px;}
}

@media (min-width:1400px){
  .header,.screen{max-width:1240px;}
}
</style>

<body>
<div id="splash">
  <svg viewBox="0 0 620 130" xmlns="http://www.w3.org/2000/svg">
    <text x="310" y="92" text-anchor="middle"><tspan class="hb-letter" style="--i:0">H</tspan><tspan class="hb-letter" style="--i:1">U</tspan><tspan class="hb-letter" style="--i:2">M</tspan><tspan class="hb-letter" style="--i:3">A</tspan><tspan> </tspan><tspan class="hb-letter" style="--i:4">B</tspan><tspan class="hb-letter" style="--i:5">A</tspan><tspan class="hb-letter" style="--i:6">N</tspan><tspan class="hb-letter" style="--i:7">K</tspan></text>

</div>

<div id="tour-root"></div>

<script>
/* =========================================================
   ICONS
========================================================= */
const ICONS = {
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1V15h4v4.5a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1V10"/>',
  card:'<rect x="2.5" y="5.5" width="19" height="13" rx="3"/><path d="M2.5 10h19"/><path d="M6 14.5h4"/>',

  user:'<circle cx="12" cy="8.2" r="3.7"/><path d="M4.5 20.2c0-4 3.4-7 7.5-7s7.5 3 7.5 7"/>',
  bell:'<path d="M6.5 8.5a5.5 5.5 0 0 1 11 0c0 5 2 6.3 2 6.3H4.5s2-1.3 2-6.3Z"/><path d="M10 18a2 2 0 0 0 4 0"/>',
  eye:'<path d="M1.5 12S5.6 5.5 12 5.5 22.5 12 22.5 12 18.4 18.5 12 18.5 1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff:'<path d="M17.7 17.7A10.6 10.6 0 0 1 12 19.3c-6.5 0-10.5-7.3-10.5-7.3a20.7 20.7 0 0 1 4.8-5.9M9.6 4.6A10.7 10.7 0 0 1 12 4.3c6.5 0 10.5 7.3 10.5 7.3a20.6 20.6 0 0 1-3 3.9"/><path d="M1 1l22 22"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',

async function genNumber(){
  let n;
  do{
    n = String(Math.floor(100000+Math.random()*899999));
    const { data } = await sb.from('accounts').select('number').eq('number',n).maybeSingle();
    if(!data) return n;
  } while(true);
}

function fmtNum(n){ const neg=n<0; return (neg?'-':'')+Math.abs(n).toFixed(2); }

async function createAccount({nom,prenom,genre,password,role,classe}){
  const number = await genNumber();
  const acc = {
    number, nom, prenom, genre:genre||'', password:password||'', role, classe:classe||'',
    name: prenom+' '+nom,
    balance: 0, status:'active', accountType:'courant',
    cards: [],
    transactions: [],
    notifications: [],
    createdAt: new Date(),
  };
  const { error } = await sb.from('accounts').insert({number,nom,prenom,genre:acc.genre,password:acc.password,role,classe:acc.classe,balance:0,status:'active',account_type:'courant'});
  if(error){ console.error('Account insert failed', error); return null; }
  // Vérification : on relit le compte pour confirmer qu'il est vraiment enregistré
  const { data:confirm } = await sb.from('accounts').select('number').eq('number',number).maybeSingle();
  if(!confirm){ return null; }
  ACCOUNTS[number] = acc;
  return acc;
}

async function loadCafeteriaMenu(){

  const [prodRes, menuRes] = await Promise.all([
    sb.from('cafeteria_products').select('*').eq('status','disponible'),

  (prodRes.data||[]).forEach(p=>{ if(todayProductIds.has(p.id)) CAFETERIA_MENU_TODAY.push({id:p.id,name:p.name,emoji:p.emoji,category:p.category,price:Number(p.price)}); });
}
// Charge UNIQUEMENT le compte connecté (pas toute la table — indispensable à 20 000+ comptes)
async function loadMyAccountData(number){
  const [accRes, cardRes, txRes, notifRes, msgRes] = await Promise.all([
    sb.from('accounts').select('*').eq('number',number).maybeSingle(),
    sb.from('cards').select('*').eq('account_number',number),
    sb.from('transactions').select('*').eq('account_number',number).order('created_at',{ascending:false}).limit(200),
    sb.from('notifications').select('*').eq('account_number',number).order('created_at',{ascending:false}).limit(100),
    sb.from('support_messages').select('*').eq('account_number',number).order('created_at',{ascending:true}).limit(200),
  ]);
  const a = accRes.data;
  if(!a) return null;
  const acc = {
    number:a.number, nom:a.nom, prenom:a.prenom, genre:a.genre, password:a.password, role:a.role, classe:a.classe,
    name:a.prenom+' '+a.nom, balance:Number(a.balance), status:a.status, accountType:a.account_type,
    eleveNom:a.eleve_nom, elevePrenom:a.eleve_prenom, relation:a.relation,
    cards:[], transactions:[], notifications:[], messages:[], createdAt:new Date(a.created_at),
  };
  (cardRes.data||[]).forEach(c=>{ acc.cards.push({id:c.id, holder:c.holder, last4:c.last4, full:c.full_number, cvv:c.cvv, exp:c.exp, frozen:c.frozen, cardBalance:Number(c.card_balance)}); });
  (txRes.data||[]).forEach(t=>{ const d=new Date(t.created_at); acc.transactions.push({id:t.id, desc:t.description, cat:t.category, amount:Number(t.amount), date:d, label:todayStr2(d)}); });
  (notifRes.data||[]).forEach(n=>{ acc.notifications.push({id:n.id, text:n.text, read:n.read, date:new Date(n.created_at)}); });
  (msgRes.data||[]).forEach(m=>{ acc.messages.push({id:m.id, sender:m.sender, body:m.body, readByUser:m.read_by_user, readByAdmin:m.read_by_admin, date:new Date(m.created_at)}); });
  ACCOUNTS[number] = acc;
  return acc;
}
// Réservé au rôle Direction : chargement borné pour son mini-panel intégré
// (la gestion complète des 20 000 comptes se fait dans le vrai dashboard admin séparé)
async function loadDirectionData(){
  const [accRes, rcRes, wdRes, msgRes] = await Promise.all([
    sb.from('accounts').select('*').neq('role','direction').order('created_at',{ascending:false}).limit(300),
    sb.from('recharge_requests').select('*').order('created_at',{ascending:false}).limit(100),
    sb.from('withdraw_requests').select('*').order('created_at',{ascending:false}).limit(100),
    sb.from('support_messages').select('*').order('created_at',{ascending:true}).limit(500),
  ]);
  (accRes.data||[]).forEach(a=>{
    if(ACCOUNTS[a.number]) return; // ne pas écraser le compte déjà chargé en détail
    ACCOUNTS[a.number] = {
      number:a.number, nom:a.nom, prenom:a.prenom, role:a.role, classe:a.classe,
      name:a.prenom+' '+a.nom, balance:Number(a.balance), status:a.status, accountType:a.account_type,
      cards:[], transactions:[], notifications:[], messages:[], createdAt:new Date(a.created_at),
    };
  });
  RECHARGE_REQUESTS.length=0;
  (rcRes.data||[]).forEach(r=>{
    const acc=ACCOUNTS[r.account_number];
    RECHARGE_REQUESTS.push({id:r.id, accountNumber:r.account_number, name:acc?acc.name:r.account_number, method:r.method, amount:Number(r.amount), ref:r.ref, proofUrl:r.proof_image_url, status:r.status, date:new Date(r.created_at)});
  });
  WITHDRAW_REQUESTS.length=0;
  (wdRes.data||[]).forEach(r=>{
    const acc=ACCOUNTS[r.account_number];
    WITHDRAW_REQUESTS.push({id:r.id, accountNumber:r.account_number, name:acc?acc.name:r.account_number, amount:Number(r.amount), fee:Number(r.fee), total:Number(r.total), status:r.status, date:new Date(r.created_at)});
  });
  ALL_MESSAGE_THREADS.length=0;
  const byAcc = {};
  (msgRes.data||[]).forEach(m=>{ (byAcc[m.account_number]=byAcc[m.account_number]||[]).push(m); });
  Object.entries(byAcc).forEach(([num,msgs])=>{
    const acc = ACCOUNTS[num];
    const last = msgs[msgs.length-1];
    const unread = msgs.filter(m=>m.sender==='user' && !m.read_by_admin).length;
    ALL_MESSAGE_THREADS.push({accountNumber:num, name:acc?acc.name:num, lastBody:last.body, lastDate:new Date(last.created_at), unread, messages:msgs.map(m=>({id:m.id, sender:m.sender, body:m.body, date:new Date(m.created_at)}))});
  });
  ALL_MESSAGE_THREADS.sort((a,b)=>b.lastDate-a.lastDate);
}
function todayStr2(d){
  const days = Math.floor((Date.now()-d.getTime())/86400000);
  if(days<=0) return "Aujourd'hui";
  if(days===1) return 'Hier';
  return d.toLocaleDateString('fr-FR');
}

let realtimeChannel = null, directionChannel = null;
const ALL_MESSAGE_THREADS = [];
function startRealtime(){
  const num = state.session;
  if(!num) return;
  if(realtimeChannel) sb.removeChannel(realtimeChannel);
  realtimeChannel = sb.channel('user-'+num)
    .on('postgres_changes', {event:'*', schema:'public', table:'accounts', filter:`number=eq.${num}`}, syncMyAccount)
    .on('postgres_changes', {event:'*', schema:'public', table:'cards', filter:`account_number=eq.${num}`}, syncMyAccount)
    .on('postgres_changes', {event:'*', schema:'public', table:'transactions', filter:`account_number=eq.${num}`}, syncMyAccount)
    .on('postgres_changes', {event:'*', schema:'public', table:'notifications', filter:`account_number=eq.${num}`}, syncMyAccount)
    .on('postgres_changes', {event:'*', schema:'public', table:'support_messages', filter:`account_number=eq.${num}`}, syncMyAccount)
    .subscribe();
  const u = user();
  if(u && u.role==='direction'){
    if(directionChannel) sb.removeChannel(directionChannel);
    directionChannel = sb.channel('direction-requests')
      .on('postgres_changes', {event:'*', schema:'public', table:'recharge_requests'}, syncDirectionRequests)
      .on('postgres_changes', {event:'*', schema:'public', table:'withdraw_requests'}, syncDirectionRequests)
      .on('postgres_changes', {event:'*', schema:'public', table:'support_messages'}, syncDirectionRequests)
      .subscribe();
  }
}

function logSecurity(accountNumber,userName,action,result){
  sb.from('security_log').insert({id:genId('SEC'), account_number:accountNumber||null, user_name:userName||'Inconnu', action, device:navigator.userAgent.slice(0,60), result});
}
async function doLogin(){
  const num = document.getElementById('l-num').value.trim();
  const pass = document.getElementById('l-pass').value;
  if(num.length!==6){ auth.loginErr='Le numéro doit contenir 6 chiffres.'; renderRoot(); return; }
  auth.loginErr=''; auth.loginBusy=true; renderRoot();
  const since = new Date(Date.now()-15*60*1000).toISOString();
  const { count } = await sb.from('security_log').select('*',{count:'exact',head:true}).eq('account_number',num).eq('result','fail').gte('created_at',since);
  if(count>=5){ auth.loginBusy=false; auth.loginErr='Trop de tentatives échouées. Réessayez dans 15 minutes.'; renderRoot(); return; }
  const { data } = await sb.from('accounts').select('*').eq('number',num).maybeSingle();
  auth.loginBusy=false;
  if(!data){ auth.loginErr='Numéro de compte introuvable.'; logSecurity(num,null,'Tentative de connexion — compte introuvable','fail'); renderRoot(); return; }
  if(data.status==='suspended'){ auth.loginErr='Ce compte est suspendu. Contactez l’administration.'; logSecurity(num,data.prenom+' '+data.nom,'Tentative de connexion — compte suspendu','fail'); renderRoot(); return; }
  if(data.password && data.password!==pass){ auth.loginErr='Mot de passe incorrect.'; logSecurity(num,data.prenom+' '+data.nom,'Mot de passe incorrect','fail'); renderRoot(); return; }
  logSecurity(num,data.prenom+' '+data.nom,'Connexion réussie','ok');
  await loadMyAccountData(num);
  loginAs(num);
}
async function loginAs(number){
  state.session = number;
  const u = ACCOUNTS[number];
  state.screen = (u.role==='direction') ? 'dashboard' : 'accueil';
  state.adminScreen = 'dashboard';
  auth.view='role'; auth.form={}; auth.loginNumber=''; auth.loginPass=''; auth.loginErr='';
  renderRoot();
  await loadCafeteriaMenu();
  if(u.role==='direction'){ await loadDirectionData(); }
  renderRoot();
  startRealtime();
  startInactivityWatch();
  try{
    if(!localStorage.getItem('huma_index_tour_seen')) setTimeout(()=>startTour(TOUR_INDEX,'huma_index_tour_seen'),600);
  }catch(e){}
}
let inactivityTimer = null;
const INACTIVITY_LIMIT_MS = 5*60*1000; // 5 minutes
function startInactivityWatch(){
  const reset = () => {
    clearTimeout(inactivityTimer);
    if(!state.session) return;
    inactivityTimer = setTimeout(()=>{
      if(state.session){ toast('Session fermée après 5 minutes d’inactivité'); logout(); }
    }, INACTIVITY_LIMIT_MS);
  };
  ['click','touchstart','keydown','scroll'].forEach(ev=>document.addEventListener(ev, reset, {passive:true}));
  reset();
}
function logout(){
  clearTimeout(inactivityTimer);
  if(realtimeChannel) sb.removeChannel(realtimeChannel);
  if(directionChannel) sb.removeChannel(directionChannel);
  realtimeChannel=null; directionChannel=null;
  state.session=null; auth.view='role'; renderRoot();
}

let lastAnimatedBalance = null;
let balanceAnimGen = 0;
function animateBalance(){
  const el = document.getElementById('bc-amount');
  if(!el || !state.showBalance) { lastAnimatedBalance = user()?.balance ?? null; return; }
  const target = parseFloat(el.dataset.value);
  const start = lastAnimatedBalance===null ? target : lastAnimatedBalance;
  lastAnimatedBalance = target;
  const myGen = ++balanceAnimGen;
  if(start===target){ el.innerHTML = money(target, true); return; }
  const dur = 700, t0 = performance.now();
  function frame(now){
    if(myGen!==balanceAnimGen) return; // une animation plus récente a pris le relais
    const p = Math.min(1,(now-t0)/dur);
    const eased = 1-Math.pow(1-p,3);
    const val = start + (target-start)*eased;
    el.innerHTML = money(val, true);
    if(p<1) requestAnimationFrame(frame);
    else el.innerHTML = money(target, true);
  }
  requestAnimationFrame(frame);
}
let lastScreenKey = null;
function playScreenEnter(){
  const key = state.session ? (state.screen+':'+(state.adminScreen||'')) : auth.view;
  const isNewScreen = key !== lastScreenKey;
  lastScreenKey = key;
  const el = document.querySelector('.content-col .screen') || document.querySelector('.screen');
  if(el && isNewScreen){ el.classList.remove('screen-enter'); void el.offsetWidth; el.classList.add('screen-enter'); }
  if(isNewScreen){
    document.querySelectorAll('.mini-chart-card canvas, .chart-card canvas').forEach(cv=>{
      cv.classList.remove('chart-reveal'); void cv.offsetWidth; cv.classList.add('chart-reveal');
    });
  }
}

}

function cafQty(id,delta){

  const u = user(); const c = u.cards[0];
  const items = Object.entries(cafCart).map(([id,qty])=>{
    const p = CAFETERIA_MENU_TODAY.find(x=>x.id===id);
    return {name:p.name, qty, price:p.price};
  });
  const amt = items.reduce((s,i)=>s+i.qty*i.price,0);
  if(amt<=0) return;
  showLoader('Paiement en cours…');
  const { data:newBal, error } = await sb.rpc('debit_card_checked', {p_card_id:c.id, p_amount:amt});
  if(error){ closeModal(); toast('Solde de la carte insuffisant — rechargez votre carte'); return; }
  c.cardBalance = Number(newBal);
  const id = genId('HB');
  const proofCode = String(Math.floor(1000+Math.random()*8999));
  const tx = {id,label:todayStr(),desc:'Paiement — Cafétéria',cat:'Cafétéria',amount:-amt,date:new Date()};
  u.transactions.unshift(tx);
  const notif = {id:genId('N'),text:'Votre commande à la cafétéria a été passée. Code de preuve : '+proofCode,date:new Date(),read:false};
  u.notifications.unshift(notif);
  await Promise.all([
    sb.from('transactions').insert({id:tx.id, account_number:u.number, description:tx.desc, category:tx.cat, amount:tx.amount}),
    sb.from('notifications').insert({id:notif.id, account_number:u.number, text:notif.text, read:false}),
    sb.from('cafeteria_orders').insert({
      id:genId('CAF'), account_number:u.number,
      client_name: u.role==='parent' ? `${u.name} — Parent de ${u.elevePrenom||''} ${u.eleveNom||''}`.trim() : u.name,
      client_type: u.role==='parent' ? 'Parent' : roleLabel(u.role),
      classe: u.classe||null,
      items, total:amt, payment:'Carte virtuelle', status:'Payée', tx_id:id, proof_code:proofCode,
    }),
  ]);
  cafCart = {};
  showResult('Commande passée',`Code de preuve : ${proofCode}`,-amt,id);
}

async function lookupTransfer(){
  const num = document.getElementById('tf-num').value.trim();
  const amt = parseFloat(document.getElementById('tf-amt').value);
  if(num.length!==6){ toast('Le numéro doit contenir 6 chiffres'); return; }
  if(num===user().number){ toast('Vous ne pouvez pas vous transférer à vous-même'); return; }
  if(!amt||amt<=0){ toast('Montant invalide'); return; }
  if(amt>user().balance){ toast('Solde insuffisant'); return; }
  const { data, error } = await sb.from('accounts').select('*').eq('number',num).maybeSingle();
  if(error || !data){ toast('Aucun compte trouvé avec ce numéro'); return; }
  if(data.status==='suspended'){ toast('Ce compte est suspendu'); return; }
  if(!ACCOUNTS[num]){
    ACCOUNTS[num] = {
      number:data.number, nom:data.nom, prenom:data.prenom, role:data.role, classe:data.classe,
      name:data.prenom+' '+data.nom, balance:Number(data.balance), status:data.status, accountType:data.account_type,
      cards:[], transactions:[], notifications:[], createdAt:new Date(data.created_at),
    };
  } else {
    ACCOUNTS[num].balance = Number(data.balance);
  }
  const target = ACCOUNTS[num];
  tfState={number:num,amount:amt,target};
  openModal(sheetWrap('Confirmer le transfert', `
    <div class="result-wrap" style="padding-top:6px;">
      <div class="cur-badge" style="width:52px;height:52px;margin:0 auto 14px;">${icon('send',22)}</div>
      <p style="font-size:14.5px;color:var(--ink);margin:0 0 4px;">Tu veux transférer</p>
      <p style="font-family:'Manrope';font-weight:800;font-size:26px;margin:0 0 4px;" class="tnum">${money(amt)}</p>
      <p style="font-size:14.5px;color:var(--ink);">à <b>${target.name}</b> ?</p>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
      <button class="btn-secondary" style="margin-top:0;" onclick="closeModal()">Annuler la transaction</button>
      <button class="btn-primary" style="margin-top:0;" onclick="executeTransfer()">Confirmer la transaction</button>
    </div>
  `));
}
async function executeTransfer(){
  const u = user(); const {amount,target} = tfState;
  const id = genId('HB'); const rxId = genId('HB');
  showLoader('Transfert en cours…');
  const { error } = await sb.rpc('transfer_money', {p_from:u.number, p_to:target.number, p_amount:amount});
  if(error){ closeModal(); toast(error.message.includes('insuffisant') ? 'Solde insuffisant' : 'Le transfert a échoué — réessayez'); return; }
  u.balance -= amount;
  target.balance += amount;
  const txOut = {id,label:todayStr(),desc:'Transfert vers '+target.name,cat:'Transfert',amount:-amount,date:new Date()};
  const txIn = {id:rxId,label:todayStr(),desc:'Reçu de '+u.name,cat:'Reçu',amount:amount,date:new Date()};
  const notif = {id:genId('N'),text:`Vous avez reçu ${fmt(amount)} de ${u.name}.`,date:new Date(),read:false};
  u.transactions.unshift(txOut);
  target.transactions.unshift(txIn);
  target.notifications.unshift(notif);
  await Promise.all([
    sb.from('transactions').insert({id:txOut.id, account_number:u.number, description:txOut.desc, category:txOut.cat, amount:txOut.amount}),
    sb.from('transactions').insert({id:txIn.id, account_number:target.number, description:txIn.desc, category:txIn.cat, amount:txIn.amount}),
    sb.from('notifications').insert({id:notif.id, account_number:target.number, text:notif.text, read:false}),
  ]);
  tfState={number:'',amount:'',target:null};
  openModal(`
    <div class="result-wrap">
      <div class="result-check">${animatedCheck(32)}</div>
      <h2>Félicitations !</h2>
      <p>Vous avez transféré <b class="tnum">${money(amount)}</b> à <b>${target.name}</b>.</p>
      <div class="summary-box" style="text-align:left;">
        <div class="summary-row"><span>Référence</span><b>${id}</b></div>
        <div class="summary-row"><span>Nouveau solde</span><b class="tnum">${money(u.balance)}</b></div>
      </div>
    </div>
    <button class="btn-primary" onclick="closeModal();renderRoot()">OK</button>`);
}

async function submitRecharge(method){
  if(submitLock) return;

  const ref = document.getElementById('rc-ref').value.trim();
  if(!amt||amt<=0){ toast('Montant invalide'); return; }

  showLoader('Envoi de la demande…');

  const id = genId('RC');

  const path = `${u.number}/${id}.${ext}`;
  const { error: upErr } = await sb.storage.from('recharge-proofs').upload(path, rcProofFile, {upsert:true});
  if(upErr){ submitLock=false; closeModal(); toast("L'envoi de la capture d'écran a échoué — réessayez"); return; }
  const { data: pub } = sb.storage.from('recharge-proofs').getPublicUrl(path);
  proofUrl = pub.publicUrl;
  const req = {id,accountNumber:u.number,name:u.name,method,amount:amt,ref,status:'pending',date:new Date()};
  RECHARGE_REQUESTS.unshift(req);
  const notif = {id:genId('N'),text:`Votre demande de recharge ${method} de ${fmt(amt)} a été envoyée à l'administration.`,date:new Date(),read:false};
  u.notifications.unshift(notif);
  await Promise.all([
    sb.from('recharge_requests').insert({id, account_number:u.number, method, amount:amt, ref:req.ref, proof_image_url:proofUrl, status:'pending'}),
    sb.from('notifications').insert({id:notif.id, account_number:u.number, text:notif.text, read:false}),
  ]);
  rcProofFile = null;
  submitLock = false;
  closeModal();
  openModal(`<div class="result-wrap"><div class="result-check">${animatedCheck(30)}</div><h2>Demande envoyée</h2><p>Référence : ${id}. En attente de validation par l'administration.</p><button class="btn-primary" onclick="closeModal();renderRoot()">OK</button></div>`);

    `).join('') : emptyState('chart','Aucune dépense','Le détail de vos dépenses par catégorie apparaîtra ici.')}

  <button class="btn-secondary" style="margin-top:16px;" onclick="downloadStatement()">${icon('back',15)} Télécharger mon relevé (CSV)</button>
  `;

function downloadStatement(){
  const u = user();
  const rows = [['Date','Description','Catégorie','Montant (HUMA)']];
  u.transactions.forEach(t=>{
    rows.push([t.date.toLocaleString('fr-FR'), t.desc, t.cat, t.amount.toFixed(2)]);
  });
  const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `releve-huma-bank-${u.number}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Relevé téléchargé');
}

let tourSteps = [], tourIdx = 0, tourStorageKey = '';
function startTour(steps, storageKey){
  tourSteps = steps; tourIdx = 0; tourStorageKey = storageKey;
  runTourStep();
}
function runTourStep(){
  clearTourHighlight();
  const step = tourSteps[tourIdx];
  if(!step){ endTour(); return; }
  if(step.before) step.before();
  requestAnimationFrame(()=>setTimeout(()=>{
    const el = document.querySelector(step.selector);
    if(!el){ tourIdx++; runTourStep(); return; }
    el.scrollIntoView({block:'center', behavior:'smooth'});
    setTimeout(()=>positionTourBubble(el, step),280);
  },60));
}
function positionTourBubble(el, step){
  el.classList.add('tour-target-highlight');
  const rect = el.getBoundingClientRect();
  const root = document.getElementById('tour-root');
  const isLast = tourIdx === tourSteps.length-1;
  root.innerHTML = `<div class="tour-bubble" id="tour-bubble">
      <h4>${step.titre}</h4>
      <p>${step.texte}</p>
      <div class="tour-foot">
        <span class="tour-count">${tourIdx+1}/${tourSteps.length}</span>
        <div class="tour-btns">
          <button class="tour-skip-btn" onclick="endTour()">Passer</button>
          <button class="tour-next-btn" onclick="nextTourStep()">${isLast?'Terminé':'Suivant →'}</button>
        </div>
      </div>
      <div class="tour-arrow" id="tour-arrow"></div>
    </div>`;
  const bubble = document.getElementById('tour-bubble');
  const bw = bubble.offsetWidth, bh = bubble.offsetHeight, margin = 14;
  const placement = step.placement || 'bottom';
  let top, left;
  if(placement==='bottom'){ top = rect.bottom+margin; left = rect.left+rect.width/2-bw/2; }
  else if(placement==='top'){ top = rect.top-bh-margin; left = rect.left+rect.width/2-bw/2; }
  else if(placement==='right'){ top = rect.top+rect.height/2-bh/2; left = rect.right+margin; }
  else { top = rect.top+rect.height/2-bh/2; left = rect.left-bw-margin; }
  left = Math.max(10, Math.min(left, window.innerWidth-bw-10));
  top = Math.max(10, Math.min(top, window.innerHeight-bh-10));
  bubble.style.top = top+'px'; bubble.style.left = left+'px';
  const arrow = document.getElementById('tour-arrow');
  if(placement==='bottom'){ arrow.style.top='-6px'; arrow.style.left=Math.max(12,Math.min(rect.left+rect.width/2-left-6,bw-24))+'px'; }
  else if(placement==='top'){ arrow.style.bottom='-6px'; arrow.style.left=Math.max(12,Math.min(rect.left+rect.width/2-left-6,bw-24))+'px'; }
  else if(placement==='right'){ arrow.style.left='-6px'; arrow.style.top=(bh/2-6)+'px'; }
  else { arrow.style.right='-6px'; arrow.style.top=(bh/2-6)+'px'; }
}
function nextTourStep(){ tourIdx++; runTourStep(); }
function clearTourHighlight(){ document.querySelectorAll('.tour-target-highlight').forEach(e=>e.classList.remove('tour-target-highlight')); }
function endTour(){
  clearTourHighlight();
  document.getElementById('tour-root').innerHTML='';
  try{ localStorage.setItem(tourStorageKey,'1'); }catch(e){}
}

async function handleRequest(kind,id,approve){
  const list = kind==='Recharge' ? RECHARGE_REQUESTS : WITHDRAW_REQUESTS;
  const table = kind==='Recharge' ? 'recharge_requests' : 'withdraw_requests';
  const req = list.find(r=>r.id===id);
  if(!req) return;
  let acc = ACCOUNTS[req.accountNumber];
  if(!acc){
    const { data } = await sb.from('accounts').select('*').eq('number',req.accountNumber).maybeSingle();
    if(!data){ toast('Compte introuvable — impossible de traiter cette demande'); return; }
    acc = ACCOUNTS[req.accountNumber] = {
      number:data.number, nom:data.nom, prenom:data.prenom, role:data.role, classe:data.classe,
      name:data.prenom+' '+data.nom, balance:Number(data.balance), status:data.status, accountType:data.account_type,
      cards:[], transactions:[], notifications:[], createdAt:new Date(data.created_at),
    };
  }
  const nowIso = new Date().toISOString();
  if(approve){
    if(kind==='Recharge'){
      const { data:newBal, error } = await sb.rpc('increment_balance', {p_number:acc.number, p_amount:req.amount});
      if(error){ toast("Échec de l'approbation — réessayez"); return; }
      acc.balance = Number(newBal);
      const tx = {id:genId('HB'),label:todayStr(),desc:'Recharge '+req.method+' approuvée',cat:'Dépôt',amount:req.amount,date:new Date()};
      acc.transactions.unshift(tx);
      const notif = {id:genId('N'),text:`Votre recharge de ${fmt(req.amount)} a été approuvée.`,date:new Date(),read:false};
      acc.notifications.unshift(notif);
      await Promise.all([
        sb.from('transactions').insert({id:tx.id, account_number:acc.number, description:tx.desc, category:tx.cat, amount:tx.amount}),
        sb.from('notifications').insert({id:notif.id, account_number:acc.number, text:notif.text, read:false}),
      ]);
    } else {
      const { data:newBal, error } = await sb.rpc('debit_balance_checked', {p_number:acc.number, p_amount:req.total});
      if(error){
        toast('Solde du compte insuffisant, refus automatique');
        req.status='rejected'; req.resolvedAt=nowIso;
        await sb.from(table).update({status:'rejected', resolved_at:nowIso}).eq('id',id);
        renderRoot(); return;
      }
      acc.balance = Number(newBal);
      const tx = {id:genId('HB'),label:todayStr(),desc:'Retrait approuvé',cat:'Retrait',amount:-req.total,date:new Date()};
      acc.transactions.unshift(tx);
      const notif = {id:genId('N'),text:`Votre retrait de ${fmt(req.amount)} a été approuvé.`,date:new Date(),read:false};
      acc.notifications.unshift(notif);
      await Promise.all([
        sb.from('transactions').insert({id:tx.id, account_number:acc.number, description:tx.desc, category:tx.cat, amount:tx.amount}),
        sb.from('notifications').insert({id:notif.id, account_number:acc.number, text:notif.text, read:false}),
      ]);
    }
    req.status='approved'; req.resolvedAt=nowIso;
    await sb.from(table).update({status:'approved', resolved_at:nowIso}).eq('id',id);
  } else {
    req.status='rejected'; req.resolvedAt=nowIso;
    const notif = {id:genId('N'),text:`Votre demande de ${kind.toLowerCase()} (${fmt(req.amount)}) a été refusée.`,date:new Date(),read:false};
    acc.notifications.unshift(notif);
    await Promise.all([
      sb.from(table).update({status:'rejected', resolved_at:nowIso}).eq('id',id),
      sb.from('notifications').insert({id:notif.id, account_number:acc.number, text:notif.text, read:false}),
    ]);
  }
  renderRoot(); toast(approve?'Demande approuvée':'Demande refusée');
}

}

      <div><b style="font-size:14px;">${roleLabel(acc.role)}${acc.classe?' · '+acc.classe:''}</b><br><span style="font-size:12px;color:var(--muted);">N° ${acc.number}</span></div>
    </div>
    <div class="summary-box">
      <div class="summary-row"><span>Solde du compte</span><b class="tnum">${money(acc.balance)}</b></div>
      <div class="summary-row"><span>Cartes actives</span><b>${acc.cards.length}</b></div>

async function toggleSuspend(num){
  const acc = ACCOUNTS[num];
  acc.status = acc.status==='suspended' ? 'active' : 'suspended';
  await sb.from('accounts').update({status:acc.status}).eq('number',num);
  closeModal(); renderRoot();
  toast(acc.status==='suspended' ? 'Compte suspendu' : 'Compte réactivé');
}
function openAdminRecharge(num){
  openModal(sheetWrap('Recharger le compte', `
    <div class="field"><label>Montant</label><input id="ar-amt" type="number" placeholder="0"></div>
    <button class="btn-primary" onclick="doAdminRecharge('${num}')">Recharger</button>
  `));
}
async function doAdminRecharge(num){
  const amt = parseFloat(document.getElementById('ar-amt').value);
  if(!amt||amt<=0){ toast('Montant invalide'); return; }
  const acc = ACCOUNTS[num];
  acc.balance += amt;
  const tx = {id:genId('HB'),label:todayStr(),desc:'Recharge administrative',cat:'Dépôt',amount:amt,date:new Date()};
  acc.transactions.unshift(tx);
  const notif = {id:genId('N'),text:`Votre compte a été rechargé de ${fmt(amt)} par l'administration.`,date:new Date(),read:false};
  acc.notifications.unshift(notif);
  await Promise.all([
    sb.from('accounts').update({balance:acc.balance}).eq('number',num),
    sb.from('transactions').insert({id:tx.id, account_number:num, description:tx.desc, category:tx.cat, amount:tx.amount}),
    sb.from('notifications').insert({id:notif.id, account_number:num, text:notif.text, read:false}),
  ]);
  closeModal(); renderRoot(); toast('Compte rechargé');
}
function openAdminDebit(num){
  openModal(sheetWrap('Débiter le compte', `
    <p class="role-hint">Le mot de passe du titulaire est requis pour débiter son compte.</p>
    <div class="field"><label>Montant</label><input id="ad-amt" type="number" placeholder="0"></div>
    <div class="field"><label>Mot de passe du titulaire</label><input id="ad-pass" type="password" placeholder="••••••"></div>
    <button class="btn-primary" onclick="doAdminDebit('${num}')">Débiter</button>
  `));
}
async function doAdminDebit(num){
  const amt = parseFloat(document.getElementById('ad-amt').value);
  const pass = document.getElementById('ad-pass').value;
  const acc = ACCOUNTS[num];
  if(!acc.password || acc.password!==pass){ toast('Mot de passe incorrect — débit impossible'); return; }
  if(!amt||amt<=0){ toast('Montant invalide'); return; }
  if(amt>acc.balance){ toast('Solde insuffisant'); return; }
  acc.balance -= amt;
  const tx = {id:genId('HB'),label:todayStr(),desc:'Débit administratif',cat:'Retrait',amount:-amt,date:new Date()};
  acc.transactions.unshift(tx);
  await Promise.all([
    sb.from('accounts').update({balance:acc.balance}).eq('number',num),
    sb.from('transactions').insert({id:tx.id, account_number:num, description:tx.desc, category:tx.cat, amount:tx.amount}),
  ]);
  closeModal(); renderRoot(); toast('Compte débité');
}

function sheetWrap(title,body){

function openModal(html){

function closeModal(){ document.getElementById('modal-root').classList.remove('open'); }

/* =========================================================
   CHARTS — flux qui "tick" en continu (démo)
========================================================= */
function pushSeries(){
  const last = state.financeSeries[state.financeSeries.length-1];
  let next = last + (Math.random()*16-8);
  next = Math.max(15,Math.min(125,next));
  state.financeSeries.push(next);
  if(state.financeSeries.length>28) state.financeSeries.shift();
  if(state.displaySeries.length<state.financeSeries.length) state.displaySeries.push(next);
}
const CHART_HEIGHTS = {'mini-chart':90,'finance-chart':170,'admin-chart':170,'role-chart':120};
function setupCanvas(cv){
  const w = Math.min(Math.max(cv.parentElement.clientWidth||300, 60), window.innerWidth-20);
  const h = CHART_HEIGHTS[cv.id] || 110;
  const dpr = window.devicePixelRatio||1;
  cv.width = w*dpr; cv.height = h*dpr;
  cv.style.width = w+'px'; cv.style.height = h+'px';
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  return {ctx,w,h};
}
function drawLineFlux(id,data,color,fillColor){
  const cv = document.getElementById(id);
  if(!cv) return;
  const {ctx,w,h} = setupCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const min=Math.min(...data), max=Math.max(...data), pad=8;
  const range = (max-min)||1;
  const stepX = (w-pad*2)/(data.length-1);
  const pts = data.map((v,i)=>[pad+i*stepX, h-pad-((v-min)/range)*(h-pad*2)]);
  ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){
    const [x0,y0]=pts[i-1], [x1,y1]=pts[i];
    const mx=(x0+x1)/2;
    ctx.bezierCurveTo(mx,y0,mx,y1,x1,y1);
  }
  ctx.lineTo(pts[pts.length-1][0],h);
  ctx.lineTo(pts[0][0],h);
  ctx.closePath();
  ctx.fillStyle = fillColor;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++){
    const [x0,y0]=pts[i-1], [x1,y1]=pts[i];
    const mx=(x0+x1)/2;
    ctx.bezierCurveTo(mx,y0,mx,y1,x1,y1);
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = 3;
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.stroke();
  const last = pts[pts.length-1];
  ctx.beginPath(); ctx.arc(last[0],last[1],4,0,Math.PI*2);
  ctx.fillStyle = color; ctx.fill();
}
function drawDoughnutChart(id,data,colors){
  const cv = document.getElementById(id);
  if(!cv) return;
  const {ctx,w,h} = setupCanvas(cv);
  ctx.clearRect(0,0,w,h);
  const total = data.reduce((a,b)=>a+b,0) || 1;
  const cx=w/2, cy=h/2, r=Math.min(w,h)/2-4, inner=r*0.6;
  let start=-Math.PI/2;
  data.forEach((v,i)=>{
    const angle = (v/total)*Math.PI*2;
    ctx.beginPath();
    ctx.arc(cx,cy,r,start,start+angle);
    ctx.arc(cx,cy,inner,start+angle,start,true);
    ctx.closePath();
    ctx.fillStyle = colors[i%colors.length];
    ctx.fill();
    start += angle;
  });
}
function fluxColor(){ return state.dark ? '#FFFFFF' : '#0A1B3D'; }
function fluxFill(){ return state.dark ? 'rgba(255,255,255,.12)' : 'rgba(10,27,61,.15)'; }
function drawCharts(){
  drawLineFlux('mini-chart', state.displaySeries, fluxColor(), fluxFill());
  drawLineFlux('finance-chart', state.displaySeries, fluxColor(), fluxFill());
  drawLineFlux('admin-chart', state.displaySeries, fluxColor(), fluxFill());
  drawDoughnutChart('role-chart', [roleCount('eleve'),roleCount('professeur'),roleCount('parent'),roleCount('direction')], ['#0C2350','#2748A0','#3E5FC4','#8FA6F5']);
}
function ensureTicker(){
  if(financeTimer) return;
  financeTimer = setInterval(pushSeries, 1500);
  function frame(){
    // smoothly ease displaySeries toward financeSeries every animation frame
    for(let i=0;i<state.financeSeries.length;i++){
      const target = state.financeSeries[i];
      const cur = state.displaySeries[i] ?? target;
      state.displaySeries[i] = cur + (target-cur)*0.06;
    }
    while(state.displaySeries.length>state.financeSeries.length) state.displaySeries.shift();
    drawLineFlux('mini-chart', state.displaySeries, fluxColor(), fluxFill());
    drawLineFlux('finance-chart', state.displaySeries, fluxColor(), fluxFill());
    drawLineFlux('admin-chart', state.displaySeries, fluxColor(), fluxFill());
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* =========================================================
   SPLASH + ROOT RENDER
========================================================= */
function renderRoot(){
  const root=document.getElementById('root');
  root.innerHTML = state.session ? renderShell() : renderAuthOrParent();
  if(!state.notifOpen) document.getElementById('modal-root').classList.remove('open');
  requestAnimationFrame(()=>{ drawCharts(); ensureTicker(); animateBalance(); playScreenEnter(); drawTxEntrances(); });
}
function renderAuthOrParent(){
  if(auth.view==='parent-info') return renderParentInfo();
  if(auth.view==='parent-password') return renderParentPassword();
  if(auth.view==='role-locked') return renderRoleLocked();
  return renderAuth();
}

async function boot(){
  renderRoot();
}
/* ============================================================
   PWA — service worker + installation native (Android/Chrome)
============================================================ */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  state.canInstall = true;
  renderRoot();
});
window.addEventListener('appinstalled', ()=>{
  deferredInstallPrompt = null; state.canInstall = false; renderRoot();
});
async function installApp(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null; state.canInstall = false; renderRoot();
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('/sw.js').catch(()=>{}); });
}
function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
}
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }

window.addEventListener('load', ()=>{
  boot();
  // Le tracé des lettres dure ~2,5s (8 lettres × .17s + .9s), puis remplissage
  setTimeout(()=>{
    const sp = document.getElementById('splash');
    if(sp) sp.classList.add('sp-fadeout');
  }, 3200);
  setTimeout(()=>{
    const sp = document.getElementById('splash');
    if(sp) sp.remove();
  }, 4000);
});
</script>
